# Four skills, one activity

Today each group designs **one teaching activity for one skill** — listening, speaking, reading or writing — builds it with AI, and teaches it to the class. The order matters: you **think first**, then **read** what research and classroom practice suggest, then **build**, then **present and reflect**. It is the same order as your portfolio, so today's work can go straight into it.

<!--

## Today, step by step
kind: section
Three hours, groups of 3–4. The board below adds up to 180 minutes, including a 10-minute break and 8 minutes of buffer for switching groups.

## Choose a skill
kind: milestone
date: 0:00–0:10
what: Each group chooses **one skill** and decides who reads which study. If two groups choose the same skill, choose different learners.

## Think first — your draft activity
kind: milestone
date: 0:10–0:25
what: **Before reading anything**, sketch your own activity using the draft frame below. This is your *starting point for today* — keep it, even if you change everything later.

## Read for your skill
kind: milestone
date: 0:25–0:50
what: Jigsaw the four studies on your skill's page: each member reads one card closely, then teaches it to the group. Every group needs at least **one classic and one recent** study it can cite. Other skills are extra reading.

## Activity board
kind: milestone
date: 0:50–1:10
what: On the **Activity board**, look through the ten activity types for your skill, try the websites and AI tools, and match tools to **at least five** activities. Choose the one activity your group will build and show.

## Revise your draft
kind: milestone
date: 1:10–1:20
what: What will you keep, change or drop because of what you read and tried? Name the study behind each change.

## Break
kind: milestone
date: 1:20–1:30

## Build it with AI
kind: milestone
date: 1:30–2:10
what: Guide an AI — **Gemini first, then Claude or ChatGPT** if you need it — to build your activity, or combine it with the tools you matched on the board. Test it, fix it, save each version.

## Present
kind: milestone
date: 2:10–2:50
what: **6 minutes of teaching plus 2 minutes of feedback per group** — four groups take 32 minutes, leaving 8 for switching and technical problems. With more than four groups, run two rooms in parallel or shorten every slot.

## Reflect
kind: milestone
date: 2:50–3:00
what: Answer the reflection questions. They follow the sections of your portfolio.

## Your draft activity · version 0
kind: prompt
Copy this into your group document and fill it in **now, without reading the skill pages**. Short answers are fine.
```text
Skill: listening / speaking / reading / writing
Our learners: (age, level, setting, one detail that matters)
Learning goal: by the end, learners can …
What learners actually do, step by step:
1.
2.
3.
Where AI could help (preparing the material? during the activity?):
How we will know it worked:
What we are least sure about:
```

## Why think first?
kind: card
If you read the research first, your activity will look like the studies. If you think first, you can see **what the research changes** in your own thinking — and that change is evidence for *What I learned* in your portfolio. Version 0 is where **today** started; your portfolio's *Where I started* still goes back to the beginning of the semester.

## How the four skill pages work
kind: card
- **Classic studies** (badge in blue) are older papers the field still builds on.
- **Recent studies** (badge in green) are from 2024–2026 and mostly involve AI.
- Each study card says *what they did*, *what they found*, and *what it means for your activity*.
- Each page ends with **three activity ideas** and the mistakes to avoid. These ideas are classroom adaptations *inspired by* the studies; the studies did not test them.
- The **Activity board** shows forty activity types — ten per skill — and nine websites and AI tools you can run them with.
- Every reference was checked against its publisher record; click a citation to open it.

<script type="text/markdown" id="md2">
# Listening

Listening happens in real time: learners cannot re-read, and a word they know in writing can disappear in fast connected speech. Research points to two levers you can design for — **how learners manage their listening** and **what support the input gives them** — and recent work asks what AI can add to both.

<!--
HOW TO EDIT
  ## Title  kind: paper (badge "Classic · year" or "Recent · year"; did / found / means; refs)
            kind: activity (do / role / check; refs) · card · questions · section
-->

## What research says
kind: section

## Teaching learners how to listen
kind: paper
badge: Classic · 2010
did: Over a semester, 106 learners in six French-as-a-second-language classes listened to the same texts the same number of times. The experimental group (59) was guided through the processes of successful listening — predicting and planning, monitoring, evaluating, problem solving. The control group (47) was not.
found: The guided group outperformed the control group on the final comprehension measure. Within the guided group, **less skilled listeners gained more than more skilled ones**. Learners' awareness of their own listening processes grew over the semester.
means: Playing the audio more often is not the same as teaching listening. Build in prediction, partner comparison and reflection between listens.
refs: vandergrift2010

## Captioned video
kind: paper
badge: Classic · 2013
did: A meta-analysis of 18 studies on L2 video with L2 captions: 15 studies measured listening comprehension, 10 measured vocabulary learning.
found: Captions had a **large effect** on both listening comprehension and vocabulary learning. The type of test used changed how large the listening effect looked; learners' proficiency level did not.
means: Captions are worth using — but decide what you are testing. A comprehension test on the content is not the same as a test of listening without support.
refs: montero2013

## A chatbot for decoding practice
kind: paper
badge: Recent · 2024
did: A flipped course for *decoding* — recognising words in connected speech — worked better than a conventional course but overloaded the teacher. The team built a chatbot as a 24/7 practice partner and compared a fully online chatbot course (46 students) with the flipped course (43).
found: The study found **no significant difference between the groups on the decoding post-test**. The authors report that the chatbot course better supported **behavioural and emotional engagement**; read the paper for when in the course each difference appeared.
means: "No significant difference" does not prove the two courses are equal. The design suggests a chatbot can take on repetitive practice and reminders that would otherwise depend on the teacher — the study did not measure teacher workload directly.
refs: huang2024

## Does AI make listening and speaking better?
kind: paper
badge: Recent · 2025
did: A review of how AI — spoken dialogue systems, intelligent personal assistants and generative AI — can support teaching, learning and assessing L2 listening and speaking.
found: AI can refine existing practice and offer new solutions, but also brings drawbacks; the authors set out practical considerations for teachers and directions for research.
means: Start from an existing good practice and ask what AI improves. Name one drawback you will manage. *(Also useful for speaking groups.)*
refs: goh2025

## Activity ideas
kind: section
These are **classroom adaptations inspired by the studies** — the exact activities were not tested in them. For seven more listening activity types, and the websites that can run them, see the **Activity board**.

## The listening cycle
kind: activity
do:
- **Predict:** learners see the title or a picture and predict words and ideas.
- **Listen and check:** first listen; note what was confirmed.
- **Compare:** partners compare notes and plan what to listen for.
- **Listen again:** check the plan; solve the problem spots.
- **Reflect:** what helped you understand this time?
role: AI drafts prediction prompts and a short script at the right level from your topic; a free text-to-speech voice or your own recording turns it into audio.
check: Does the script sound like speech, not like writing read aloud?
refs: vandergrift2010

## Captions with a plan
kind: activity
do:
- First viewing with full captions, focusing on meaning.
- Second viewing with captions off; learners note what they now catch.
- A short task that uses the content.
role: AI drafts the comprehension questions and a captions-on / captions-off worksheet.
check: This sequence is a design choice — the meta-analysis shows captions help, not that this order is best. Watch what your learners can do without captions.
refs: montero2013

## Hear it, type it
kind: activity
do:
- Learners hear short chunks of fast speech (*want to → wanna*, linked words) and type what they hear.
- Hints appear on request: number of words, first letters, the written form.
- A final round with new chunks and no hints.
role: AI builds the interactive page; the browser's built-in text-to-speech can read each chunk aloud.
check: Synthetic voices vary between devices, and one voice means one accent. Add recordings of real speakers where you can.
refs: huang2024

## Mistakes to avoid
kind: card
- Playing the audio again and again with no new purpose.
- Comprehension questions that test reading or memory more than listening.
- AI scripts that sound written, not spoken — no hesitations, no natural speed.
- Only one voice and one accent; learners will meet many.

## Revisit your draft
kind: questions
- Where in your activity do learners *manage* their listening, not only listen?
- What support (captions, script, hints) do they get — and when is it removed?
- Which study supports your main design decision?

</script>
<script type="text/markdown" id="md3">
# Speaking

Learners need to speak a lot to learn to speak — and many hesitate to. Research asks two questions you can design for: **what kind of feedback makes learners try again**, and **what practice space lowers the barrier to speaking**. Recent studies test AI chatbots as that space, including with young learners.

<!--
HOW TO EDIT
  ## Title  kind: paper (badge; did / found / means; refs) · activity (do / role / check; refs) · card · questions · section
-->

## What research says
kind: section

## Feedback that makes learners try again
kind: paper
badge: Classic · 1997
did: An analysis of 18.3 hours of interaction in four primary-level French immersion classrooms, classifying six types of teacher feedback and how learners responded to each.
found: Teachers overwhelmingly used **recasts** (repeating the learner's sentence correctly), yet recasts were the least likely to lead learners to repair their own speech. **Elicitation, metalinguistic clues, clarification requests and repetition** led to learner-generated repair more often.
means: If your activity includes a feedback partner — human or AI — ask it to prompt the learner to try again, not just to say the correct form. Note what was measured: immediate repair in the lesson, which is not the same as long-term learning.
refs: lyster1997

## Text chat as rehearsal for speech
kind: paper
badge: Classic · 2002
did: A classroom experiment in which the experimental group spent two of four weekly contact hours in a text chatroom, grounded in models of speech production and working memory.
found: The chatroom group developed **more oral proficiency** than the control group.
means: Typing in real time can rehearse the same processes as speaking. A chat round before a speaking round gives hesitant learners time to plan.
refs: payne2002

## An AI partner for speaking practice
kind: paper
badge: Recent · 2024
did: EFL learners did interactive speaking activities with an AI chatbot (Andy); a comparison group did conventional face-to-face speaking activities with peers. The study measured speaking performance and willingness to communicate, and asked learners about the experience.
found: The AI-mediated activities were **more effective for speaking performance and willingness to communicate**, and learners viewed them positively.
means: An AI partner can lower the barrier to speaking. It was compared with peer practice, so plan how AI practice leads back to talking with people.
refs: fathi2024

## Chatbots with young learners — alone or in pairs
kind: paper
badge: Recent · 2024
did: 85 elementary EFL learners in a three-week summer programme (45 minutes a day) practised with a generative-AI chatbot called CoolE Bot, either individually or in pairs; a third group had conventional instruction.
found: **Both chatbot groups outperformed** the conventional group on speaking tests. **No significant difference was detected between individual and paired** use. Learners reported enjoyment, more confidence and less anxiety; pairs also helped each other.
means: "No significant difference" is not proof that pairs and individuals do equally well — but paired use is worth trying where devices are limited, and it adds peer support. The study used one specific chatbot for three weeks; general-purpose tools such as ChatGPT or Claude have age limits, so check them before using a chatbot with children.
refs: tai2024

## Activity ideas
kind: section
These are **classroom adaptations inspired by the studies** — the exact activities were not tested in them. For seven more speaking activity types, and the websites that can run them, see the **Activity board**.

## Rehearse with AI, perform with people
kind: activity
do:
- Pairs share one device and practise a role-play with an AI partner (ordering food, asking for directions, a club interview).
- Swap partners and perform the same role-play **without** the AI.
- The listener asks one follow-up question the AI did not ask.
role: The AI plays the other speaker and keeps the conversation going with short questions.
check: Who talks more — the AI or the learner? Limit the AI to one or two sentences per turn. For learners under 18, check the tool's age rules (see the AI studio).
refs: tai2024 | fathi2024

## Chat first, then talk
kind: activity
do:
- Five minutes of text chat on the topic in pairs or small groups.
- Five minutes of spoken discussion on the same topic, without the chat window.
- Learners note one phrase they used in both.
role: AI suggests the discussion questions and a short list of useful phrases at the learners' level.
check: The spoken round must be new talk, not reading the chat aloud. Payne & Whitney studied a semester of chat sessions — this five-plus-five sequence is our adaptation, not their design.
refs: payne2002

## A partner who prompts, not corrects
kind: activity
do:
- Write the AI's instructions: when the learner makes an error, ask a clarification question or give a clue — do not give the correct sentence.
- Learners talk with the AI, then note when they corrected themselves.
- Compare with a version where the AI simply restates the correct form.
role: The AI acts as the conversation partner with your feedback rules.
check: Does the AI actually follow the rule? Language models often slip back into correcting.
refs: lyster1997

## Mistakes to avoid
kind: card
- The AI talks more than the learner.
- Correcting every error and stopping the conversation.
- Measuring only enjoyment, not what learners can say afterwards.
- Giving young learners general-purpose AI tools that are 18+ only.

## Revisit your draft
kind: questions
- How much will each learner actually speak in your activity — in minutes or turns?
- What happens when a learner makes an error?
- When does practice with AI lead back to speaking with people?

</script>
<script type="text/markdown" id="md4">
# Reading

Digital reading gives teachers tools print never had: words that explain themselves when clicked, questions generated in seconds, a text rewritten at an easier level on demand. Research shows which of these help — and recent work warns that "easier" text is not always easier to understand.

<!--
HOW TO EDIT
  ## Title  kind: paper (badge; did / found / means; refs) · activity (do / role / check; refs) · card · questions · section
-->

## What research says
kind: section

## Pictures, text or video glosses?
kind: paper
badge: Classic · 1996
did: Three studies with 160 university learners of German reading in a hypermedia program whose words could be annotated with text, pictures or video.
found: Learners picked up more vocabulary incidentally than expected (25% on production tests, 77% on recognition). Words annotated with **pictures plus text** were remembered significantly better than words with video plus text or text alone, and the type of annotation learners looked up tended to be the cue they used to remember the word.
means: For concrete target words, a picture plus a short definition is a strong gloss. Video is not automatically better.
refs: chunplass1996

## What glosses do for reading
kind: paper
badge: Classic · 2008
did: A meta-analysis of 11 studies on computer-mediated glosses in L2 reading.
found: Glosses had a **medium effect on reading comprehension** and a **large effect on incidental vocabulary learning**; effects varied with learners' level, the type of text and how learning was assessed.
means: Glossing helps vocabulary most. Choose which words to gloss on purpose, and match the gloss to your learners' level.
refs: abraham2008

## Can ChatGPT write reading questions?
kind: paper
badge: Recent · 2024
did: The researchers asked ChatGPT to write multiple-choice reading comprehension items targeting given reading subskills and materials, then compared them with human-written items, and gathered views through questionnaires, expert judgement and interviews.
found: ChatGPT's items were **comparable to human-written items on the psychometric measures**, and reviewers saw its potential as a test developer and a teaching assistant for reading.
means: AI can draft questions aimed at specific subskills (main idea, detail, inference, vocabulary in context). You still check every key and every distractor.
refs: lin2024

## Is AI-simplified text easier to understand?
kind: paper
badge: Recent · 2025
did: The study compared L2 readers' comprehension of three versions of a passage: the original, a version simplified by human experts, and a version simplified automatically with **Cleartext**, a machine-learning simplification tool — not ChatGPT.
found: Once readers' **topic familiarity** was taken into account, **neither simplified version was easier to understand** than the original in this study.
means: Shorter words and sentences do not guarantee comprehension; what readers already know about the topic matters. The study does not show that today's chatbots cannot help — it shows you should test any AI-simplified text with learners (for example, by asking them to think aloud) before relying on it.
refs: murphyodo2025

## Activity ideas
kind: section
These are **classroom adaptations inspired by the studies** — the exact activities were not tested in them. For seven more reading activity types, and the websites that can run them, see the **Activity board**.

## Picture-glossed reading
kind: activity
do:
- Choose 6–8 target words in a short text.
- Learners read; clicking a word shows a picture and a short definition.
- After reading, a quick recall task with the pictures, then one with words only.
role: AI drafts the definitions at the learners' level and describes a picture for each word; it can build the clickable page.
check: Do the pictures show the meaning clearly? Are the definitions simpler than the words they explain?
refs: chunplass1996 | abraham2008

## Questions by subskill
kind: activity
do:
- AI drafts one question each for main idea, detail, inference and vocabulary in context.
- The teacher checks and fixes them.
- After answering, learners write one question of their own for another group.
role: AI drafts the items and the answer key.
check: Can a learner answer any question *without* reading the text? Is there exactly one correct answer?
refs: lin2024

## Original or simplified? Explore it
kind: activity
do:
- Before reading, learners meet the topic through pictures, a short video or a quick discussion.
- Half the class reads the original text, half an AI-simplified version.
- Groups compare: what did each half understand, and where did they get stuck?
- The class writes one question to test next time — for example, *Would the simplified text still help without the topic preparation?*
role: AI produces the simplified version and the pre-reading prompts.
check: This is a classroom exploration, not an experiment — both halves had the same preparation, so you cannot tell whether the topic or the language helped. Did the simplification remove meaning the task needs?
refs: murphyodo2025

## Mistakes to avoid
kind: card
- Glossing so many words that the text becomes a dictionary.
- Questions that can be answered from general knowledge.
- Assuming a simplified text is an easier text.
- Uploading copyrighted textbook texts to public AI tools.

## Revisit your draft
kind: questions
- What will learners understand, notice or learn from the text — and how will you know?
- What support do they get while reading, and does it target the right words?
- If AI changes the text, how will you check it is still worth reading?

</script>
<script type="text/markdown" id="md5">
# Writing

Feedback is the centre of writing instruction — and the oldest argument in the field is whether correcting grammar helps at all. AI now produces feedback instantly, which makes the real question sharper: **what do learners do with the feedback**, and does improving *this* draft mean they write better *next* time?

<!--
HOW TO EDIT
  ## Title  kind: paper (badge; did / found / means; refs) · activity (do / role / check; refs) · card · questions · section
-->

## What research says
kind: section

## The case against grammar correction
kind: paper
badge: Classic · 1996
did: A position paper reviewing research and theory on correcting grammar in L2 writing classes.
found: Truscott argued that grammar correction **should be abandoned**: research showed it ineffective, there were theoretical and practical reasons to expect that, and it can do harm. The paper started a long-running debate in the field.
means: Do not assume more correction is better. Decide what your feedback is for, how much, and what learners must do with it.
refs: truscott1996

## Automated writing evaluation in the classroom
kind: paper
badge: Classic · 2006
did: A review of automated writing evaluation (AWE): how the systems work, what research had found, and a proposed agenda for studying how AWE is actually used in classrooms.
found: Scoring engines had been studied psychometrically, but **little research looked at classroom use** and its results. The authors called for research on both the writing process and the products.
means: The useful question is not "is the machine's score accurate?" but "how will learners and teachers use its feedback?"
refs: warschauer2006

## Teacher feedback or ChatGPT feedback?
kind: paper
badge: Recent · 2026
did: 20 Chinese undergraduates wrote argumentative essays, received feedback from both their teacher and ChatGPT, and revised. The researchers analysed the revisions and surveyed the students.
found: Students **engaged more and revised more accurately with teacher feedback**, especially on language and content — but they were particularly successful at using **ChatGPT's feedback on organisation**. They preferred teacher feedback overall while recognising ChatGPT's strengths.
means: Use AI feedback as a complement. With 20 students in one setting, this is a reason to *try* giving each source a different job — not a rule about which source does what.
refs: zou2026

## Working through AI feedback alone or together
kind: paper
badge: Recent · 2024
did: A seven-week experiment with 117 second-year EFL students and six teachers at a Chinese university. Students processed ChatGPT feedback individually, or together with a teacher, with peers, or with both.
found: Students who worked through the feedback **individually improved their drafts the most** — but those who worked through it **with their teacher did best on a new, similar writing task**.
means: A better draft is not the same as learning. If you want learners to write better next time, build in teacher-guided discussion of the AI feedback and check with a new task.
refs: yan2024

## Activity ideas
kind: section
These are **classroom adaptations inspired by the studies** — the exact activities were not tested in them. For seven more writing activity types, and the websites that can run them, see the **Activity board**.

## Two sources, one decision
kind: activity
do:
- Learners receive teacher or peer feedback **and** AI feedback on the same paragraph.
- In a table, they decide for each suggestion: accept, change or reject — and why.
- They revise, then explain one decision to a partner.
role: AI gives feedback using criteria you set (organisation, ideas, language).
check: Which source did learners trust, and were they right to?
refs: zou2026

## Discuss the feedback, then write something new
kind: activity
do:
- Groups read AI feedback on a sample paragraph with the teacher guiding the discussion.
- Each learner writes a **new** short paragraph on a different topic, without AI.
- Compare: which feedback points show up in the new paragraph?
role: AI produces the feedback on the sample paragraph.
check: The new paragraph — not the revised one — shows what was learned.
refs: yan2024

## One error pattern, indirect feedback · a design to test
kind: activity
do:
- Tell the AI to give feedback on **one** pattern only (for example verb forms), marking where the problem is without correcting it.
- Learners correct the marked places themselves, then check with a partner.
- A short new piece of writing tests the same pattern.
role: AI marks the pattern according to your rules.
check: Did the AI stick to one pattern, and did it avoid giving the answers? Neither study below shows that this activity works: Truscott raises the question of whether correction helps at all, and Warschauer & Ware ask how automated feedback is used in class. Treat it as a design to test, and use the new piece of writing as your evidence.
refs: truscott1996 | warschauer2006

## Mistakes to avoid
kind: card
- Letting the AI rewrite the whole text — then nobody knows what the learner can do.
- Judging success only by the revised draft.
- Feedback on everything at once.
- Pasting learners' writing into free AI tools without their agreement.

## Revisit your draft
kind: questions
- Who gives feedback in your activity, on what, and when?
- What must learners *do* with the feedback?
- How will you check learning with a new piece of writing?

</script>
<script type="text/markdown" id="md6">
# Activity board

Forty small activity types — ten for each skill — and nine websites and AI tools that can run them. **Pick a tool, then click every activity it could serve.** One tool can fit several activities, and one activity can combine several tools. Your matches stay in this browser; copy them into your group document before you leave.

<!--
HOW TO EDIT
  ## L1 … W10        kind: act   · skill: L/S/R/W · name: · how:
  ## <tool id>       kind: tool  · mono: (2-letter badge) · name: · url: · by: · what: · mind: · model: (activity codes, | separated) · why:
  ## Theory tags     kind: tags  · bullets "TAG — meaning"
  Other ## blocks render as ordinary cards/steps above the board.
-->

## Four steps
kind: section

## Look at all the activities in your skill
kind: step
do: Use the skill buttons to show your skill. Read all ten — the code (L1, S4 …) is how you will name your activity later.

## Try the websites and AI tools
kind: step
do: Open each tool below the board and try it for two minutes. Read **Before you use it** on each tool card.

## Match tools to activities
kind: step
do: Choose a tool, then click each activity it could serve. The same tool may fit several activities; you may combine tools for one activity. Match **at least five activities** with at least one tool each.

## Choose your group's activity
kind: step
do: Fill in the worksheet under the board for the **one** activity your group will build and show. You will start your presentation with it.

## L1
kind: act
skill: L
name: Clip → transcript → gist/detail
how: Play a short clip twice — first for a one-sentence gist, then with the transcript for three detail answers.

## L2
kind: act
skill: L
name: Dictogloss
how: Read a 100–150-word passage twice while students take notes; pairs reconstruct the text and compare it with the original.

## L3
kind: act
skill: L
name: Minimal-pair detective
how: Read word pairs aloud; students mark which one they heard, then check together as a class.

## L4
kind: act
skill: L
name: Modelled note-taking → imitate
how: Demonstrate live note-taking on a 1–2-minute clip; students copy the approach on a new clip.

## L5
kind: act
skill: L
name: Caption gap-fill
how: Remove key linkers from a transcript; students listen and restore the missing words.

## L6
kind: act
skill: L
name: Speed ladder
how: Play the same clip at 0.75× for comprehension, then at 1.0× to catch new details.

## L7
kind: act
skill: L
name: Accent compare
how: Play two short clips with different accents; students list the differences and the strategies that helped them understand.

## L8
kind: act
skill: L
name: Signal-word hunt
how: Students tick off contrast, addition and time markers as they hear them, then verify against the transcript.

## L9
kind: act
skill: L
name: Audio → visual map
how: After a short talk, students turn the main points into a quick mind map and compare in pairs.

## L10
kind: act
skill: L
name: Listening jigsaw
how: Groups summarise different segments of a talk, then teach their part so the class can rebuild the whole.

## S1
kind: act
skill: S
name: Private rehearsal → pair share
how: Students practise a 60-second talk silently or into their phone, then deliver it to a partner.

## S2
kind: act
skill: S
name: Role-play with fading cues
how: Round 1 gives sentence starters, round 2 only keywords, round 3 no cues.

## S3
kind: act
skill: S
name: Picture prompt trio
how: Show one image; students describe it, compare its elements, then infer or hypothesise about its context.

## S4
kind: act
skill: S
name: Retell with constraints
how: Students retell a short story using exactly two linkers and one relative clause.

## S5
kind: act
skill: S
name: Mini-debate (30-second CER)
how: Pairs take 30-second turns giving claim, evidence and reasoning until both sides have spoken twice.

## S6
kind: act
skill: S
name: Pronunciation clinic
how: Drill target minimal pairs or sentences, first in chorus, then individually, with quick corrective feedback.

## S7
kind: act
skill: S
name: Story co-build
how: Pairs take turns adding one sentence to a shared story, keeping tense and viewpoint consistent.

## S8
kind: act
skill: S
name: Pragmatics rehearsal
how: Students practise speech acts such as requests and apologies with scenario cards and peer feedback.

## S9
kind: act
skill: S
name: Elevator pitch
how: Learners prepare and deliver a 45–60-second self-introduction or idea pitch to a timer, then refine it once.

## S10
kind: act
skill: S
name: Fluency ladder
how: Students speak on the same topic for 30, then 45, then 60 seconds, aiming for fewer pauses and fillers each round.

## R1
kind: act
skill: R
name: Level & compare
how: Give the original and a simplified version of the same paragraph; students highlight what changed and why.

## R2
kind: act
skill: R
name: Connector hunt
how: Students underline *however*, *although*, *despite* and similar words and note the function each one signals.

## R3
kind: act
skill: R
name: Skim → scan → probe
how: One gist question, then fact-finding questions, then one inference question on the same text.

## R4
kind: act
skill: R
name: Jigsaw reading
how: Each student masters one section of a text and teaches it to a new group.

## R5
kind: act
skill: R
name: Headline match
how: Students match mixed-up headlines and paragraphs and justify their choices.

## R6
kind: act
skill: R
name: Paraphrase ladder
how: Students paraphrase a paragraph at A2, then B1, then B2, keeping the meaning while adding complexity.

## R7
kind: act
skill: R
name: Cloze builder (rational)
how: Delete only reference words or linkers; peers complete the gaps and discuss any that are ambiguous.

## R8
kind: act
skill: R
name: Graphic organiser
how: Students turn the text into a cause–effect, sequence or claim–evidence diagram.

## R9
kind: act
skill: R
name: Vocabulary in context
how: Learners write in-text definitions and one example sentence for six target words from the passage.

## R10
kind: act
skill: R
name: Fact-check chain
how: Students pick three claims from the text and find the exact lines that support them.

## W1
kind: act
skill: W
name: Model → imitate → rewrite
how: Analyse a model paragraph's structure, imitate it on a new topic, then rewrite freely without the scaffold.

## W2
kind: act
skill: W
name: Sentence frames → free
how: Draft with sentence frames in round 1; write a second draft without them in round 2.

## W3
kind: act
skill: W
name: Micro-writes (100–150 words)
how: A quick daily write on a narrow prompt, with one improvement target collected per entry.

## W4
kind: act
skill: W
name: Write → review → rewrite
how: Students draft, exchange for peer comments with a short rubric, then submit a revised version.

## W5
kind: act
skill: W
name: Error corpus
how: Collect common class errors, cluster them by pattern, and write a one-line "fix rule" with a corrected example.

## W6
kind: act
skill: W
name: Sentence combining
how: Combine five short kernel sentences into two grammatical, information-rich sentences.

## W7
kind: act
skill: W
name: Argument builder
how: Fill in claim, two reasons, evidence and a counter-argument in a table before drafting a paragraph.

## W8
kind: act
skill: W
name: Data commentary
how: Write 4–5 sentences on a simple chart: trend, peak, comparison and implication.

## W9
kind: act
skill: W
name: Email genre swap
how: Rewrite an email from informal to formal (or the reverse) and underline the register changes.

## W10
kind: act
skill: W
name: Reflection note
how: After a writing task, add 3–4 sentences on what changed in revision and why.

## learnyourway
kind: tool
mono: LY
name: Learn Your Way
url: https://learnyourway.withgoogle.com/
by: Google Research experiment
what: Turns textbook material into several formats — immersive text with embedded questions, narrated slides, an audio lesson, a mind map and quizzes. The demos are school-subject lessons (for example science and economics) in English.
mind: You mainly work with Google's demo lessons; check whether adding your own material is open. It is content-subject English, not an English course — choose a lesson your learners could follow.
model: L1 | L9 | R3 | R8
why: The audio lesson suits gist and detail listening and mind-mapping; the immersive text with questions suits skim–scan–probe; the mind map is a ready-made graphic organiser to compare with learners' own.

## lll
kind: tool
mono: LL
name: Little Language Lessons
url: https://labs.google/lll/en
by: Google Labs experiment (Gemini)
what: Three small experiments: **Tiny Lesson** gives words, phrases and tips for a situation you type; **Slang Hang** generates an informal conversation; **Word Cam** labels objects in a photo with words in the target language.
mind: Everything is AI-generated — check phrases and slang before teaching them. Check that your learners' language pair is offered.
model: S3 | S8 | R9 | W9
why: Tiny Lesson prepares phrases for a speech-act scenario; Word Cam gives vocabulary for a picture prompt; Slang Hang supplies informal language to contrast with a formal register.

## pronounce
kind: tool
mono: Pr
name: Pronounce
url: https://www.getpronounce.com/
by: Commercial AI speaking coach (not a Google product)
what: Learners record themselves; the app analyses pronunciation and clarity, points to sounds and words to practise, and offers AI conversation coaches in several accents.
mind: Needs an account; the free plan is limited. It uploads learners' voice recordings to a company — get consent, and do not use it with children's voices.
model: S1 | S6 | S9 | S10 | L7
why: Private recording with feedback before speaking to a partner; targeted sound practice; timed talks; coaches with different accents for comparison.

## quizlet
kind: tool
mono: Qz
name: Quizlet
url: https://quizlet.com/latest
by: Commercial flashcard platform
what: Teacher- or student-made card sets with audio, and study modes such as Flashcards, Learn, Test and Match.
mind: Some study modes are limited on the free plan. Card audio is text-to-speech — check minimal pairs by ear before using them.
model: L3 | R9 | W5
why: Audio cards for hearing pairs of words; definition-and-example cards for vocabulary in context; "error → fix rule" cards for an error corpus.

## wordwall
kind: tool
mono: Ww
name: Wordwall
url: https://wordwall.net/
by: Commercial activity maker
what: Turns your content into games and printables from templates such as Quiz, Match up, Flashcards and Spin the wheel.
mind: The free Basic plan allows 3 activities and 12 templates (check the price page). Ready-made community activities vary in quality.
model: R5 | R9 | W5 | S5 | S9
why: Match up for headlines and paragraphs; quizzes for "which sentence is correct?"; Spin the wheel to pick debate or pitch topics.

## wordcoach
kind: tool
mono: WC
name: Google Word Coach
url: https://www.google.com/search?q=google+word+coach
by: Vocabulary game inside Google Search
what: Short rounds of five questions on word meanings, synonyms, antonyms and pictures.
mind: The official game runs inside Google Search (search "Google Word Coach", easiest on a phone). The *googlewordscoach.com* site in the handout is an unofficial fan site.
model: R9
why: A two-minute vocabulary warm-up; follow it with an activity where learners use the words.

## semantris
kind: tool
mono: Se
name: Semantris
url: https://research.google.com/semantris/
by: Google Research word-association game
what: Type a clue word; a language model decides which words on screen are most related. *Arcade* is fast and timed; *Blocks* is slower.
mind: The model judges how related words are, not whether the English is correct. Use it to talk about meaning, then check with a dictionary.
model: R8 | R9
why: After a few rounds, learners build a word web of related terms — a graphic organiser — and explain the links.

## artsculture
kind: tool
mono: AC
name: The Lab · Google Arts & Culture
url: https://artsandculture.google.com/lab
by: Google Arts & Culture experiments
what: A collection of experiments. **Say What You See** shows an image; learners type a description of up to 120 characters, and the AI generates an image from it to compare with the original.
mind: Say What You See is typed — for speaking, have learners describe aloud first. It teaches image prompting, so precise nouns and adjectives score well.
model: S3 | W3 | W6
why: A picture prompt to describe and compare; a very short write with an instant visual check; compressing several details into one precise sentence.
link: [Open Say What You See](https://artsandculture.google.com/experiment/say-what-you-see/jwG3m7wQShZngw)

## englinker
kind: tool
mono: En
name: Englinker
url: https://englinker.com/about/
by: Independent site run by one founder
what: A curated directory of English-learning resources — books and documents, games, tools and AI, videos and podcasts — with study guides. It is a list of links, not an exercise site.
mind: It describes itself as a first version. Check each resource it links to before using it with learners.
model: L1 | L7
why: Its videos and podcasts section is a quick place to find clips for gist-and-detail listening and for comparing accents.

- Piaget — reorganising what you know when new information does not fit

# Build it with AI

You have your first idea and you have read the research. Now **revise the plan**, then **guide** an AI to build it — you make the design decisions; the AI does the construction. Use the free versions: **Gemini first**, then Claude or ChatGPT if you need a second attempt.

## Five steps
kind: section

## Revise your draft · version 1
kind: step
do: Go back to your version 0. For each part, write **keep**, **change** or **drop** — and name the study behind every change. Keep version 0 unchanged; your portfolio needs both. If you matched websites on the Activity board, decide here: build your own page, use an existing tool, or combine them.

## Write the specification
kind: step
do: Fill in the specification below. The more precise it is, the less you fix later.

## Generate
kind: step
do: Paste the builder prompt, your specification and the add-on for your skill into Gemini with **Canvas** selected. Open **Preview**.
tip: In Claude, turn on **Settings → Capabilities → Cloud code execution and file creation** first. In ChatGPT, copy the code into a plain-text file, save it as `activity.html` and open it in Chrome.

## Test it as a learner
kind: step
do: For closed questions, try a right answer, a wrong answer and no answer. For open speaking or writing tasks, walk through the steps, hints, criteria and checklist instead — the page cannot judge free answers. Try it on a phone, and for listening, play the audio on the device you will present with. Then send the test prompt below.
check: Are all answer keys correct? Does the activity do what your plan says — or something easier to build?

## Revise and save each version
kind: step
do: Ask for specific changes, one at a time. Save every version and note what you changed and why. The before-and-after is evidence for your presentation and your portfolio.

## The prompts
kind: section
Replace everything in [square brackets].

## Your specification
kind: prompt
```text
Skill: [listening / speaking / reading / writing]
Learners: [age, level, setting, one detail that matters]
Learning goal: by the end, learners can [observable goal]
Activity steps: [your revised steps from version 1]
Research basis: [author and year] — [the design decision it supports]
Where AI helps: [preparing material / during the activity / feedback]
Success check: [what learners do at the end, with new content]
```

## Builder prompt
kind: prompt
```text
You are helping a teacher build a classroom activity. Use my specification below exactly; do not change the learning goal or the steps.

[PASTE YOUR SPECIFICATION]

Build ONE self-contained HTML page that:
1. Shows the learning goal in learner-friendly English.
2. Runs the activity steps in order, with clear instructions on each screen.
3. For closed-answer items, uses teacher-checked answer keys, offers an optional hint first, and explains the answer. For open speaking and writing tasks, provides criteria, an example and a self/peer checklist instead; it does not claim to score free speech or diagnose a learner's text.
4. Ends with a final independent task on new content, with hints and model answers unavailable.
5. Has a "For the teacher" section with the answer key and a 5-line lesson plan (timing, grouping, materials).
Requirements: no external libraries, images or links; no AI calls; no collection or storage of learner data; large readable text; works with keyboard only; does not rely on colour alone; works on a phone.
After the code, list the checks you made on every answer key.
```

## Add-on · listening
kind: prompt
```text
Listening: use the browser's built-in speech synthesis (Web Speech API) to read each audio chunk aloud, with Play, Slower and Replay buttons. Hide the transcript until after the learner answers. Write the script as natural speech, with contractions and short sentences.
```

## Add-on · speaking
kind: prompt
The page itself makes no AI calls, so it cannot hold a real conversation. It prepares learners; talking to an AI partner is a **separate step** in another tool, with the instructions below.
```text
Speaking: the page prepares learners to speak with a partner rather than talking to them. Include a role card for each partner, 4–6 useful phrases with example sentences, a planning space, and a "listener checklist" with one follow-up question to ask. If I want an AI conversation partner, write its instructions separately: replies of one or two sentences, one question per turn, and when the learner makes an error, ask a clarification question or give a clue instead of correcting it.
```

## Add-on · reading
kind: prompt
```text
Reading: show the text with [6–8] target words underlined. Clicking a word opens a short, level-appropriate definition and a simple picture drawn with inline SVG (no image files). After reading, add questions by subskill: one main idea, one detail, one inference, one vocabulary in context. Each question must need the text to answer.
```

## Add-on · writing
kind: prompt
```text
Writing: the page guides learners through writing a short [genre] paragraph on [topic], then a self-check on ONE pattern: [e.g. verb tense]. Provide a checklist and two example sentences, and show learners WHERE to look in their own writing without correcting it for them. Finish with a short new writing task on a different topic.
```

## Test it before you present
kind: prompt
```text
Review the page you built as a strict teacher and as a learner at [level]:
1. Check every answer key for closed items and list any errors. For open tasks, check that the criteria, example and checklist match the learning goal, and that the page never pretends to grade free answers.
2. List any words or structures above [level].
3. Check: keyboard use, text size, contrast, phone layout, anything that relies on sound or colour alone. For listening, tell me which parts I must check by ear on a real device.
4. Does every step practise [learning goal]? Which step practises something else?
Fix the three most important problems and tell me exactly what you changed.
```

# Sources

Sixteen studies: two classic and two recent for each skill. Every reference was checked against its DOI record, and every summary on the skill pages was written from the study's abstract, checked against the full text where it was open. Where we could not confirm a detail, the summary leaves it out rather than guess. "No significant difference" is reported as exactly that — not as proof that two options are equal.

<!-- ## id + apa/doi = a reference; other ## blocks render as cards -->

## The sixteen at a glance
kind: card
wide: yes

| Skill | Classic | Classic | Recent | Recent |
|---|---|---|---|---|
| **Listening** | Vandergrift & Tafaghodtari (2010) — teaching *how* to listen | Montero Perez et al. (2013) — captioned video, meta-analysis | Huang et al. (2024) — chatbot for decoding | Goh & Aryadoust (2025) — AI for listening and speaking |
| **Speaking** | Lyster & Ranta (1997) — feedback and uptake | Payne & Whitney (2002) — text chat and oral proficiency | Fathi et al. (2024) — AI-mediated speaking and WTC | Tai & Chen (2024) — chatbots with elementary learners |
| **Reading** | Chun & Plass (1996) — multimedia glosses | Abraham (2008) — glosses, meta-analysis | Lin & Chen (2024) — ChatGPT-written reading items | Murphy Odo (2025) — AI-simplified texts |
| **Writing** | Truscott (1996) — the case against grammar correction | Warschauer & Ware (2006) — AWE in the classroom | Zou et al. (2026) — teacher vs ChatGPT feedback | Yan (2024) — processing AI feedback together |

## Two dates we had to check
kind: card
wide: yes
Checking references is not only for AI output. Two of today's studies show why.
- **Payne & Whitney.** The issue is dated 2002 (CALICO Journal 20[1], confirmed in [ERIC EJ655669](https://eric.ed.gov/?id=EJ655669)), but the publisher's DOI record says 2003 and Semantic Scholar says 2013. We cite **2002**.
- **Zou et al.** Published online in January 2025, in the printed issue (volume 39, issue 4) in 2026 — see the [publisher's page](https://www.tandfonline.com/doi/abs/10.1080/09588221.2024.2447279). Following APA, we cite the **issue year, 2026**, not the earliest date in the DOI record.

## abraham2008
apa: Abraham, L. B. (2008). Computer-mediated glosses in second language reading comprehension and vocabulary learning: A meta-analysis. *Computer Assisted Language Learning, 21*(3), 199–226.
doi: 10.1080/09588220802090246

apa: Chun, D. M., & Plass, J. L. (1996). Effects of multimedia annotations on vocabulary acquisition. *The Modern Language Journal, 80*(2), 183–198.

doi: 10.1017/s0267190525100111

doi: 10.64152/10125/73572

## lin2024
apa: Lin, Z., & Chen, H. (2024). Investigating the capability of ChatGPT for generating multiple-choice reading comprehension items. *System, 123*, Article 103344.
doi: 10.1016/j.system.2024.103344

## lyster1997
apa: Lyster, R., & Ranta, L. (1997). Corrective feedback and learner uptake: Negotiation of form in communicative classrooms. *Studies in Second Language Acquisition, 19*(1), 37–66.
doi: 10.1017/S0272263197001034

## montero2013

doi: 10.1016/j.system.2013.07.013

/* ── markdown ── */
function inline(s){
  let t=esc(s);

  t=t.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");

}
function md(src){
  if(!src) return "";
  const L=String(src).replace(/\r\n?/g,"\n").split("\n");
  let out="",list=null,para=[],code=null,table=false,lang="",started=false;
  const fp=()=>{if(para.length){out+="<p>"+inline(para.join(" "))+"</p>";para=[]}};
  const cl=()=>{if(list){out+="</"+list+">";list=null}};
  const ct=()=>{if(table){out+="</tbody></table></div>";table=false}};
  for(const line of L){
    if(code!==null){ if(/^```/.test(line)){
        const pre=lang==="sample"
          ? '<pre class="sample">'+code.split("\n").map((l,i,a)=>'<span class="ln'+(l.trim()?'':' blank')+(/^(Interviewer:|\()/.test(l)?' muted-line':'')+'">'+esc(l)+(i<a.length-1?"\n":"")+"</span>").join("")+"</pre>"
          : "<pre>"+esc(code)+"</pre>";
        out+=pre+'<div class="copyrow"><button class="pill" data-copypre>Copy</button><span class="status"></span></div>';code=null
      } else code+=(code===""&&!started?"":"\n")+line, started=true; continue; }
    if(/^```/.test(line)){fp();cl();ct();code="";started=false;lang=line.slice(3).trim();continue}
    if(/^\s*\|/.test(line)){
      fp();cl();
      if(/^[\s|:\-]+$/.test(line)) continue;
      const cells=line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      if(!table){out+='<div class="tblwrap"><table><thead><tr>'+cells.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";table=true}
      else out+="<tr>"+cells.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
      continue;
    }
    ct();
    if(!line.trim()){fp();cl();continue}
    let m;
    if((m=line.match(/^(#{1,6})\s+(.*)$/))){fp();cl();const n=Math.min(m[1].length+2,6);out+="<h"+n+">"+inline(m[2])+"</h"+n+">";continue}
    if((m=line.match(/^>\s?(.*)$/))){fp();cl();out+='<div class="card kind-note">'+inline(m[1])+"</div>";continue}
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){fp();if(list!=="ul"){cl();out+="<ul>";list="ul"}out+="<li>"+inline(m[1])+"</li>";continue}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(list!=="ol"){cl();out+="<ol>";list="ol"}out+="<li>"+inline(m[1])+"</li>";continue}
    para.push(line.trim());

  if(code!==null) out+="<pre>"+esc(code)+"</pre>";

}
/* ## blocks with "key: value" fields; a field with no value collects the "- " lines below it */
function parseDoc(src){
  const clean=String(src).replace(/<!--[\s\S]*?-->/g,"").replace(/\r\n?/g,"\n");
  const parts=clean.split(/^##\s+/m);
  const head=parts.shift()||"";
  const title=(head.match(/^#\s+(.*)$/m)||[])[1]||"";
  const intro=head.replace(/^#\s+.*$/m,"").trim();
  const items=parts.map(block=>{
    const nl=block.indexOf("\n");
    const t=(nl<0?block:block.slice(0,nl)).trim();
    const rest=nl<0?"":block.slice(nl+1);
    const f={},bullets=[],body=[];let cur=null,inCode=false;
    for(const line of rest.split("\n")){
      if(/^```/.test(line)){inCode=!inCode;body.push(line);cur=null;continue}
      if(inCode){body.push(line);continue}
      const m=line.match(/^([a-z][a-z0-9_]*):[ \t]*(.*)$/);
      if(m){const k=m[1],v=m[2].trim();if(v){f[k]=v;cur=null}else{f[k]=[];cur=k}continue}
      const b=line.match(/^\s*[-*]\s+(.*)$/);
      if(b){ if(cur) f[cur].push(b[1].trim()); else bullets.push(b[1].trim()); continue; }
      if(!line.trim()){cur=null;body.push(line);continue}
      cur=null;body.push(line);
    }
    return {title:t,f,bullets,body:body.join("\n").trim()};
  });
  return {title,intro,items};
}

function shortCite(apa){

  let inner="";
  if(it.f.badge){const b=it.f.badge, c=/^classic/i.test(b)?" b-classic":/^recent/i.test(b)?" b-recent":"";
    inner+='<span class="badge'+c+'">'+esc(b)+"</span>";}
  inner+="<h4>"+inline(it.title)+"</h4>";
  /* lead text first, then labelled fields — except samples, where the context comes before the text */
  if(k==="sample"){ inner+=fieldsHtml(it.f)+md(it.body); } else { inner+=md(it.body); inner+=fieldsHtml(it.f); }
  if(k==="checklist"){
    const st=store.get(CONFIG.storeKey+"-chk",{});
    inner+=it.bullets.map(b=>{const id="c"+(checkIndex++);return '<label class="chk"><input type="checkbox" data-chk="'+id+'"'+(st[id]?" checked":"")+"><span>"+inline(b)+"</span></label>"}).join("");
  }else if(k==="questions"){
    inner+='<ol class="qlist">'+it.bullets.map(b=>"<li>"+inline(b)+"</li>").join("")+"</ol>";
    inner+='<div class="copyrow"><button class="pill" data-copyq>Copy these questions</button><span class="status"></span></div>';
  }else if(it.bullets.length){
    inner+="<ul>"+it.bullets.map(b=>"<li>"+inline(b)+"</li>").join("")+"</ul>";
  }
  if(it.f.link) inner+='<p style="margin:.6rem 0 0">'+inline(it.f.link)+"</p>";
  if(it.f.refs) inner+='<div style="margin-top:.5rem">'+chips(it.f.refs)+"</div>";
  return '<article class="card kind-'+k+(k==="step"?" step":"")+'">'+inner+"</article>";
}
function renderItems(items){
  let out="",group=null,buf=[];
  const flush=()=>{ if(!buf.length) return;
    const k=group, cls=k==="step"?"steps":k==="milestone"?"timeline":"grid"+(["prompt","wide"].includes(k)?" wide":"");
    out+='<div class="'+cls+'">'+buf.join("")+"</div>"; buf=[]; };
  for(const it of items){
    const k=it.f.kind||"card";
    if(k==="section"){flush();group=null;out+=itemHtml(it);continue}
    const g=(it.f.wide==="yes"||k==="prompt"||k==="sample"||k==="reveal")?"wide":(k==="step"||k==="milestone"?k:"grid");
    if(g!==group){flush();group=g}
    buf.push(itemHtml(it));
  }
  flush(); return out;
}

const SKILLS={L:["Listening","M3 18v-6a9 9 0 0 1 18 0v6|M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"],
  S:["Speaking","M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z|M8 9h8M8 13h5"],
  R:["Reading","M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z|M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"],
  W:["Writing","M12 20h9|M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"]};
const TOOLCOL=["#3E6B77","#B9752B","#5C7A3C","#A8442A","#6B5B95","#2F7F6F","#8A6D1F","#4F6D9A","#7A4E3A"];
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+SKILLS[k][1].split("|").map(d=>'<path d="'+d+'"/>').join("")+"</svg>";
const BOARD={acts:[],tools:[],tags:[],skill:"all",tool:null,model:false};
const bstate=()=>store.get(CONFIG.storeKey+"-board",{map:{},ws:{}});
const bsave=st=>store.set(CONFIG.storeKey+"-board",st);
function boardHtml(d){
  const acts=d.items.filter(x=>x.f.kind==="act"), tools=d.items.filter(x=>x.f.kind==="tool"), tagIt=d.items.find(x=>x.f.kind==="tags");
  BOARD.acts=acts.map(a=>({code:a.title,skill:a.f.skill,name:a.f.name||"",how:a.f.how||""}));
  BOARD.tools=tools.map((t,i)=>({id:t.title,name:t.f.name||t.title,col:TOOLCOL[i%TOOLCOL.length],mono:t.f.mono||(t.f.name||t.title).split(/[\s·]+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join("").slice(0,2)||t.title.slice(0,2).toUpperCase(),model:list(t.f.model),f:t.f}));
  BOARD.tags=tagIt?tagIt.bullets.map(b=>{const m=b.split(/\s+—\s+/);return {tag:m[0],what:m[1]||""}}):[];
  const rest=d.items.filter(x=>!["act","tool","tags"].includes(x.f.kind));
  let h=renderItems(rest);
  h+='<div class="board" id="board"><div class="bbar">'+
    '<div class="brow"><span class="lbl">Skill</span><button class="sk" data-skill="all" aria-pressed="true">All forty</button>'+
      Object.keys(SKILLS).map(k=>'<button class="sk" data-skill="'+k+'" aria-pressed="false" style="--c:var(--'+k+')">'+icon(k)+SKILLS[k][0]+"</button>").join("")+"</div>"+
    '<div class="brow"><span class="lbl">Tool</span>'+BOARD.tools.map(t=>'<button class="tl" data-tool="'+esc(t.id)+'" aria-pressed="false" title="'+esc(t.f.by||"")+'"><span class="mono" style="background:'+t.col+'">'+esc(t.mono)+"</span>"+esc(t.name)+"</button>").join("")+"</div>"+
    '<div class="brow"><div class="meter" id="meter"></div><span style="flex:1"></span>'+
      '<button class="pill" id="bModel" aria-pressed="false">Show a model mapping</button><button class="pill" id="bCopy">Copy my matches</button><button class="pill" id="bClear">Clear</button><span class="status" id="bStatus"></span></div>'+
    '<div class="bhint" id="bhint"></div></div>'+
    Object.keys(SKILLS).map(k=>'<section class="skillblock" data-block="'+k+'" style="--c:var(--'+k+')"><div class="skillhead"><span class="ico">'+icon(k)+'</span><h3>'+SKILLS[k][0]+'</h3><span class="cnt" data-cnt="'+k+'"></span></div><div class="tiles">'+
      BOARD.acts.filter(a=>a.skill===k).map(a=>'<button class="tile" data-act="'+esc(a.code)+'"><span class="code">'+esc(a.code)+'</span><span class="nm">'+inline(a.name)+'</span><span class="hw">'+inline(a.how)+'</span><span class="tags"></span></button>').join("")+"</div></section>").join("")+
    "</div>";
  h+='<h3 class="sec">The nine tools</h3><div class="sec-body">Try each one before you match it. The tags under each card show the model mapping — open them only after your own sorting.</div><div class="toolcards">'+
    BOARD.tools.map(t=>'<article class="card toolcard" style="--tc:'+t.col+'"><h4>'+esc(t.name)+'</h4><div class="by">'+esc(t.f.by||"")+"</div>"+
      (t.f.what?'<div class="field"><span class="flabel">What it does</span>'+inline(t.f.what)+"</div>":"")+
      (t.f.mind?'<div class="field"><span class="flabel">Before you use it</span>'+inline(t.f.mind)+"</div>":"")+
      '<p style="margin:.5rem 0 0"><a href="'+esc(t.f.url)+'" target="_blank" rel="noopener">Open '+esc(t.name)+" ↗</a>"+(t.f.link?" · "+inline(t.f.link):"")+"</p>"+
      '<details style="margin-top:.5rem"><summary class="small muted" style="cursor:pointer">Model mapping</summary><div class="fits">'+t.model.map(c=>"<span>"+esc(c)+"</span>").join("")+'</div><p class="small" style="margin:.4rem 0 0">'+inline(t.f.why||"")+"</p></details></article>").join("")+"</div>";
  if(BOARD.tags.length) h+='<h3 class="sec">Theory tags</h3><div class="sec-body">Shorthand for your justification — choose one to three.</div><div class="tagrow">'+BOARD.tags.map(t=>'<span class="tg"><b>'+esc(t.tag)+"</b>"+esc(t.what)+"</span>").join("")+"</div>";
  h+='<h3 class="sec">Our group\'s activity</h3><div class="sec-body">The one activity you will build and show. It saves in this browser; copy it into your group document.</div>'+
    '<div class="card ws" id="ws"><label>Activity<select data-ws="act"><option value="">Choose…</option>'+
      Object.keys(SKILLS).map(k=>'<optgroup label="'+SKILLS[k][0]+'">'+BOARD.acts.filter(a=>a.skill===k).map(a=>'<option value="'+esc(a.code)+'">'+esc(a.code+" · "+a.name)+"</option>").join("")+"</optgroup>").join("")+"</select></label>"+
    '<div class="autotools" id="wsTools"></div>'+
    '<label>Why this activity type? (skill and activity in one line)<input type="text" data-ws="why"></label>'+
    '<div><span class="flabel">Theory tags (1–3)</span><div class="chkrow">'+BOARD.tags.map(t=>'<label><input type="checkbox" data-wstag="'+esc(t.tag)+'">'+esc(t.tag)+"</label>").join("")+"</div></div>"+
    '<label>How we will use it (one sentence)<textarea data-ws="how"></textarea></label>'+
    '<div class="copyrow"><button class="pill" id="wsCopy">Copy worksheet</button><span class="status"></span></div></div>'+
    '<div class="card kind-note" style="margin-top:.8rem">Presentation opener: <em>"Here\'s our activity [code + name] using [tools or our page]. We chose it because [one line]; theory tags [list]; quick demo: [10–20 seconds]."</em></div>';
  return h;
}
function paintBoard(){
  const st=bstate(), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t]));
  $$("#board .sk").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.skill===BOARD.skill)));
  $$("#board .tl").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tool===BOARD.tool)));
  $$("#board .skillblock").forEach(s=>s.hidden=BOARD.skill!=="all"&&s.dataset.block!==BOARD.skill);
  $("#bModel").setAttribute("aria-pressed",String(BOARD.model));
  $("#bModel").textContent=BOARD.model?"Hide the model mapping":"Show a model mapping";
  const active=BOARD.tool&&byId[BOARD.tool];
  $$("#board .tile").forEach(el=>{
    const c=el.dataset.act, mine=(st.map[c]||[]).filter(id=>byId[id]);
    const model=BOARD.model?BOARD.tools.filter(t=>t.model.includes(c)&&!mine.includes(t.id)):[];
    el.querySelector(".tags").innerHTML=mine.map(id=>'<span style="background:'+byId[id].col+'" title="'+esc(byId[id].name)+'">'+esc(byId[id].mono)+"</span>").join("")+
      model.map(t=>'<span class="model" title="Model: '+esc(t.name)+'">'+esc(t.mono)+"</span>").join("");
    el.classList.toggle("matched",mine.length>0);
    el.classList.toggle("hit",!!active&&mine.includes(active.id));
    el.classList.toggle("cand",!!active&&BOARD.model&&active.model.includes(c)&&!mine.includes(active.id));
    el.setAttribute("aria-pressed",String(!!active&&mine.includes(active.id)));
    el.setAttribute("aria-label",c+" "+el.querySelector(".nm").textContent+(mine.length?", matched with "+mine.map(id=>byId[id].name).join(", "):""));
  });
  const n=BOARD.acts.filter(a=>(st.map[a.code]||[]).some(id=>byId[id])).length;
  $("#meter").innerHTML='<span class="dots">'+[0,1,2,3,4].map(i=>'<i class="'+(i<n?"on":"")+'"></i>').join("")+"</span><span><b>"+n+"</b> "+(n===1?"activity":"activities")+" matched"+(n>=5?" — goal reached":" · goal: 5")+"</span>";
  Object.keys(SKILLS).forEach(k=>{const el=document.querySelector('[data-cnt="'+k+'"]'); if(el) el.textContent=BOARD.acts.filter(a=>a.skill===k&&(st.map[a.code]||[]).length).length+" of 10 matched";});
  $("#bhint").innerHTML=active?"Now click every activity <b>"+esc(active.name)+"</b> could serve. Click again to remove it.":"Choose a tool above, then click activities to match it.";
  const ws=st.ws||{}, a=BOARD.acts.find(x=>x.code===ws.act);
  $("#wsTools").innerHTML=a?"Tools matched to "+esc(a.code)+": "+(((st.map[a.code]||[]).filter(id=>byId[id]).map(id=>esc(byId[id].name)).join(", "))||"none yet — match some on the board, or plan to build your own page."):"";
}
function initBoard(){
  if(!$("#board")) return;
  const st=bstate(), ws=st.ws||{};
  $$("#ws [data-ws]").forEach(el=>{el.value=ws[el.dataset.ws]||""});
  $$("#ws [data-wstag]").forEach(el=>{el.checked=(ws.tags||[]).includes(el.dataset.wstag)});
  const hdr=()=>document.documentElement.style.setProperty("--hdr",$("header.top").offsetHeight+"px"); hdr(); window.addEventListener("resize",hdr);
  $("#board").addEventListener("click",e=>{
    const sk=e.target.closest("[data-skill]"); if(sk){BOARD.skill=sk.dataset.skill;return paintBoard();}
    const tl=e.target.closest("[data-tool]"); if(tl){BOARD.tool=BOARD.tool===tl.dataset.tool?null:tl.dataset.tool;return paintBoard();}
    const ti=e.target.closest("[data-act]");
    if(ti){ if(!BOARD.tool){$("#bhint").innerHTML="<b>Choose a tool first</b> — then click the activities it could serve.";return;}
      const s=bstate(), c=ti.dataset.act, arr=s.map[c]||[], i=arr.indexOf(BOARD.tool);
      if(i<0) arr.push(BOARD.tool); else arr.splice(i,1); s.map[c]=arr; bsave(s); return paintBoard(); }
  });
  $("#bModel").onclick=()=>{BOARD.model=!BOARD.model;paintBoard()};
  $("#bClear").onclick=()=>{ if(!confirm("Clear all your matches on this board?")) return; const s=bstate(); s.map={}; bsave(s); paintBoard(); };
  const say=(el,t)=>{el.textContent=t;setTimeout(()=>el.textContent="",2500)};
  const copy=(text,el)=>(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>say(el,"Copied.")).catch(()=>say(el,"Copy failed — select and copy by hand."));
  $("#bCopy").onclick=()=>{
    const s=bstate(), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t.name]));
    const lines=BOARD.acts.filter(a=>(s.map[a.code]||[]).some(id=>byId[id])).map(a=>a.code+" "+a.name+": "+s.map[a.code].filter(id=>byId[id]).map(id=>byId[id]).join(" + "));
    copy(lines.length?"Activity board matches ("+lines.length+")\n"+lines.join("\n"):"No matches yet.",$("#bStatus"));
  };
  const saveWs=()=>{const s=bstate(); s.ws={tags:$$("#ws [data-wstag]").filter(x=>x.checked).map(x=>x.dataset.wstag)}; $$("#ws [data-ws]").forEach(el=>s.ws[el.dataset.ws]=el.value); bsave(s); paintBoard();};
  $("#ws").addEventListener("input",saveWs); $("#ws").addEventListener("change",saveWs);
  $("#wsCopy").onclick=e=>{
    const s=bstate(), w=s.ws||{}, a=BOARD.acts.find(x=>x.code===w.act), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t.name]));
    const text=["Activity: "+(a?a.code+" · "+a.name:""),"Link/tool: "+(a?(s.map[a.code]||[]).filter(id=>byId[id]).map(id=>byId[id]).join(" + "):""),"Why this bin: "+(w.why||""),"Theory tags: "+(w.tags||[]).join(", "),"How we'd use it: "+(w.how||"")].join("\n");
    copy(text,e.target.nextElementSibling);
  };
  paintBoard();
}

applyTheme(store.get("course-theme","light"));

function go(k,scroll){
  $$(".phase").forEach(p=>p.classList.toggle("on",p.id==="p-"+k));
  $$(".ph").forEach(b=>b.setAttribute("aria-current",String(b.dataset.go===String(k))));
  if(scroll!==false){ window.scrollTo({top:0,behavior:"instant"}); requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"instant"})); }
}
function fromHash(){const m=location.hash.match(/^#p-([0-9r]+)$/);return m&&CONFIG.pages.some(p=>p[0]===m[1])?m[1]:CONFIG.pages[0][0]}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");
  if(b){const k=b.dataset.go; if(location.hash==="#p-"+k) go(k); else location.hash="p-"+k; return;}
  const cp=e.target.closest("[data-copypre],[data-copyq]");
  if(cp){
    const text=cp.hasAttribute("data-copypre")?cp.closest(".copyrow").previousElementSibling.textContent
      :[...cp.closest(".card").querySelectorAll(".qlist li")].map((li,i)=>(i+1)+". "+li.textContent).join("\n");
    const st=cp.nextElementSibling;
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>st.textContent="Copied.")
      .catch(()=>{st.textContent="Select the text and copy it manually."});
  }
});
window.addEventListener("hashchange",()=>go(fromHash()));
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-chk]"); if(!c) return;
  const st=store.get(CONFIG.storeKey+"-chk",{}); st[c.dataset.chk]=c.checked; store.set(CONFIG.storeKey+"-chk",st);
});

async function load(){
  const texts={};
  await Promise.all(CONFIG.pages.map(async([k])=>{
    const emb=document.getElementById("md"+k); if(emb){texts[k]=emb.textContent;return}
    try{
      const path=k==="r"?"content/refs.md":window.CONTENT_FILES[k];
      const r=await fetch(path,{cache:"no-store"}); if(!r.ok) throw 0; texts[k]=await r.text();
    }catch(e){texts[k]=null}
  }));
  if(Object.values(texts).every(t=>t==null)){
    $("#loadWarn").innerHTML='<div class="banner"><strong>The content did not load.</strong> Browsers block <code>content/*.md</code> when this file is opened from disk. Use the web address, the standalone file, or run <code>python3 -m http.server</code> in this folder.</div>';
    return;
  }
  const refsDoc=parseDoc(texts.r||"");
  refsDoc.items.forEach(it=>{ if(it.f.apa) REFS[it.title]={apa:it.f.apa,doi:it.f.doi||"",url:it.f.url||"",short:shortCite(it.f.apa)}; });
  $("#phases").innerHTML=CONFIG.pages.map(([k,label],i)=>{
    const d=parseDoc(texts[k]||"");
    let body;
    if(k==="r"){
      const refs=d.items.filter(x=>x.f.apa).sort((a,b)=>a.f.apa.localeCompare(b.f.apa));
      body=md(d.intro)+renderItems(d.items.filter(x=>!x.f.apa))+(refs.length?'<h3 class="sec">References</h3>'+refs.map(x=>
        '<div class="refitem" id="ref-'+esc(x.title)+'">'+inline(x.f.apa)+'<div class="links">'+
        (x.f.doi?'<a href="https://doi.org/'+esc(x.f.doi)+'" target="_blank" rel="noopener">DOI ↗</a>':"")+
        (x.f.url?'<a href="'+esc(x.f.url)+'" target="_blank" rel="noopener">Open ↗</a>':"")+
        '<a href="https://scholar.google.com/scholar?q='+encodeURIComponent(x.f.apa.replace(/\*/g,"").slice(0,150))+'" target="_blank" rel="noopener">Scholar ↗</a></div></div>').join(""):"");
    }else if(d.items.some(x=>x.f.kind==="act")) body='<div class="intro">'+md(d.intro)+"</div>"+boardHtml(d);
    else body='<div class="intro">'+md(d.intro)+"</div>"+renderItems(d.items);
    const prev=CONFIG.pages[i-1], next=CONFIG.pages[i+1];
    return '<section class="phase" id="p-'+k+'"><div class="kicker">'+esc(CONFIG.kicker)+" · "+esc(label)+"</div><h2>"+esc(d.title||label)+"</h2>"+body+
      '<div class="pager">'+(prev?'<button class="pill" data-go="'+prev[0]+'">← '+esc(prev[1])+"</button>":"<span></span>")+
      (next?'<button class="pill" data-go="'+next[0]+'">'+esc(next[1])+" →</button>":"<span></span>")+"</div></section>";
  }).join("");
  initBoard();
  go(fromHash(), !!location.hash);
}
