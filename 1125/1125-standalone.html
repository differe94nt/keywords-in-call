<script type="text/markdown" id="md1">
# Reading Vahid Aryadoust

This week we read one researcher closely. Vahid Aryadoust works on **language assessment**, but his studies reach every theme of this semester: **teaching, testing, materials design, the four skills and AI**. Reading fifteen of his papers side by side shows how one research agenda moves from *what are we measuring?* to *can AI help us measure and teach it?*

<!--
HOW TO EDIT
  ## Title   kind: card · section · matrix (draws the paper map from papers.md) · step · questions
-->

## Who he is
kind: section

## Position
kind: card
- Associate Professor of language assessment, **National Institute of Education (NIE), Nanyang Technological University, Singapore** — at NIE since 2016.
- Honorary Associate Professor, Institute of Education, University College London; Visiting Professor, Xi'an Jiaotong University.
- PhD in English Language and Literature, NIE Singapore (2011).
link: [NTU profile](https://dr.ntu.edu.sg/entities/person/Vahid-Aryadoust) · [ORCID](https://orcid.org/0000-0001-6960-2489) · [Google Scholar](https://scholar.google.com/citations?user=qlxy_-kAAAAJ&hl=en)

## Research areas
kind: card
- Language assessment, especially **listening** and **reading comprehension**
- **Quantitative methods**: Rasch measurement, meta-analysis, neural networks
- **Sensors in assessment**: eye tracking, brain imaging and skin response, to see how test takers process a test
- **Generative AI** in language assessment and teaching
- **Scientometrics**: mapping a research field through its citation networks

## Books
kind: card
- *Building a Validity Argument for a Listening Test of Academic Proficiency* (Cambridge Scholars, 2013)
- *Trends in Language Assessment Research and Practice* (ed. with J. Fox, Cambridge Scholars, 2016)
- *Quantitative Data Analysis for Language Assessment*, Vol. I (2019) and Vol. II (2020), ed. with M. Raquel (Routledge)

## Recognition
kind: card
- Editorial board, *Annual Review of Applied Linguistics* (appointed 2025)
- Intercontinental Academia Fellowship (2018–2019)
- John Cheung Social Media Award (2020) for his YouTube channel *Statistics and Theory*, which teaches research statistics
- Google Scholar, checked 23 Nov 2026: about 5,100 citations, h-index 41
link: [NIE news on the ARAL appointment](https://www.ntu.edu.sg/nie/news-events/news/detail/ell-faculty-member-appointed-to-editorial-board-of-the-leading-journal)

## Why his work matters
kind: section
Three lines of influence run through the papers this week.

## 1 · Mapping a field before studying it
kind: card
His **scientometric reviews** use citation networks to show what a field has studied and where the gaps are — for comprehension subskills, for CALL, for automated feedback. They are a model for the literature review in your own final project.

## 2 · Asking what a test really measures
kind: card
Much of his work asks whether scores mean what we think: **validity arguments**, **construct definitions** of listening, the effect of **unreliable measures** on research results. The same questions apply to any quiz, rubric or AI score you design.

## 3 · Testing AI, not trusting it
kind: card
His recent studies put generative AI to work — writing listening tests, scoring EAP speaking, giving formative feedback to children — and then check the output with the same measurement tools used for human raters and items.

## The fifteen papers on one map
kind: matrix
Each dot shows a theme the paper speaks to. Cross-theme papers appear on more than one page; the buttons take you there.

## How to read this week
kind: section

## Choose and read
kind: step
do: Each group takes **one page** (Validity, Listening, Speaking, Reading, Writing, or CALL & AI). Every member reads one paper on it closely — the full text where there is a **Download** button, the summary card where there is not.

## Fill in the four boxes
kind: step
do: For your paper, check the card against the paper: **research question, method, key findings, implications for teaching or test design**. Correct anything the card gets wrong or leaves out.

## Connect it to the semester
kind: step
do: Name one earlier week this paper speaks to — evaluating materials (W3–W4), learner language (W7), the four skills (W10) — and one thing it would change in your final project.

## Tasks before tools
kind: step
do: On **Tasks: TBLT & PBL**, check the 11/11 activity board against the definition of a task, and compare task-based with problem-based learning.

## Then build
kind: step
do: On **Build a chatbot**, turn one finding into a listening or speaking chatbot on Mizou, and practise your own speaking on Yoodli.

## Questions for the discussion
kind: questions
- What does each paper claim to measure — and how do the authors show that it measures that?
- Where does AI do well in these studies, and what did humans still have to check?
- Which finding would change how you design a classroom test or a coursebook unit?
- Which paper's method could you borrow for your own final project?

<script type="text/markdown" id="md2">
# Validity & measurement

Every quiz, rubric and AI score makes a claim about learners. Validity asks **whether the evidence supports that claim**; reliability asks **how much of the score is error**. These papers are the measurement backbone of everything else this week — and of **W13, Digital assessment and test design**.

<!--
HOW TO EDIT
  ## Title   paper: <id from papers.md> · angle: why it is on this page
  Other kinds: card · questions · section
-->

## Start here
kind: section

## What counts as validity?
paper: argval
angle: The framework behind the AWE and AWF reviews on the Writing page — and a critique of it from the classroom's point of view.

## Unreliable tests hide real relationships
paper: relmeta
angle: A measurement lesson in numbers: low reliability shrinks the correlations researchers report.

## Measurement inside the skill studies
kind: section
These papers sit on skill pages, but each one is also a validity study.

## Defining the construct
paper: typology
angle: Before you can validate a listening test, you have to say what listening is — most studies never did.

## Validating automated scoring
paper: awesr
angle: An argument-based validity review in practice: which inferences have AWE studies backed, and which have they skipped?

## Validating automated feedback
paper: awfsr
angle: Validation of feedback accuracy had the least research and the weakest results.

## An AI rater against human raters
paper: gptspeak
angle: Many-facet Rasch measurement used to compare a GPT examiner with human raters.

## Does video change the rating?
paper: visflu

<script type="text/markdown" id="md8">
# Tasks: TBLT and PBL

The way this course is built — choose a skill, try the tools, build an activity, present it, get feedback — is a **task cycle**. So is today's chatbot build. This page gives the research behind **task-based language teaching (TBLT)**, compares it with **problem-based learning (PBL)**, and links both back to Aryadoust's work on assessment.

<!--
HOW TO EDIT
  ## Title   kind: section · card · step · reveal · prompt (fenced ``` block) · questions
  Literature cards: badge · key (list) · design (list) · basis · link · refs
  References are in refs.md (ids: ellis2009, long2016, ellis2017, ellis2021, swan2005, bryfonski2019,
  butler2011, norris2016, ziegler2016, chong2020, willis1996, barrows1996, savery2006, kirschner2006,
  hmelo2007, strobel2009, lin2018, beckett2005). Checked 24 Nov 2026.
-->

## What counts as a task?
kind: section
"Task" means different things to different writers — some textbooks use it for any exercise. Start with the definitions.

## Four criteria
kind: card
Ellis (2009) calls an activity a task when:
- the **primary focus is on meaning**, not on practising a form;
- there is some kind of **gap** — information, opinion or reasoning — to close;
- learners rely mainly on **their own language resources** to do it;
- there is a **clearly defined outcome** other than the use of language.
refs: ellis2009

## Task-based or task-supported?
kind: card
- **Task-based (Long):** the whole course is built on tasks — a needs analysis finds the real-world *target tasks*, *pedagogic tasks* move from simple to complex, each series ends in an *exit task*, and assessment is task-based too. There is no grammar syllabus.
- **Task-supported:** tasks are used to practise a grammar or vocabulary syllabus.
- **Ellis's middle way:** a syllabus that is mainly task-based, with task-supported lessons added for language problems that tasks alone do not fix.
refs: long2016 | ellis2017

## Kinds of task
kind: card
- **Unfocused** tasks elicit language in general; **focused** tasks are designed so that learners have to process a particular form.
- **Input-based** tasks (listen or read, then act) do not require speaking or writing; **output-based** tasks do.
- Input-based tasks suit **beginners**, large classes and learners used to traditional teaching; output-based tasks are needed for higher proficiency.
refs: ellis2017

## Real-world or pedagogic?
kind: card
A **real-world task** copies something learners will do outside class, such as booking a hotel room. A **pedagogic task**, such as *spot the difference*, never happens in real life but produces real interaction — turn-taking, repairing misunderstandings. Ellis argues that a needs analysis of target tasks is hard to carry out in many state school systems in East Asia, where learners' future uses of English are hard to predict.
refs: ellis2017

## A lesson as a task cycle
kind: section
Willis (1996) organises a task-based lesson in three phases. Form is dealt with **before and after** the task, not during it.
refs: willis1996

## Pre-task
kind: step
do: Introduce the topic and the task; activate useful words and phrases; learners may hear or see others doing a similar task.

## Task cycle
kind: step
do:
- **Task:** pairs or groups do the task, using whatever language they have.
- **Planning:** they prepare to report to the class — this is where attention to accuracy naturally rises.
- **Report:** they present what they did or decided.

## Language focus
kind: step
do: Learners analyse language from the task texts or recordings, then practise it.

## The 11/11 lesson as a task cycle
kind: card
wide: yes
| Willis phase | What we did on 11/11 |
|---|---|
| Pre-task | Chose a skill, wrote a first draft activity, read the research for that skill, tried the tools on the activity board |
| Task | Built the activity with an AI tool, tested it as a learner, revised it |
| Planning | Filled in the worksheet and the version log; prepared the 6-minute talk |
| Report | Presented: learners and goal, first idea to revised plan, three minutes teaching the activity |
| Language focus | Peer feedback, *What the AI got right and wrong*, the reflection |
For you as future teachers the outcome is a **product** — an activity that solves a teaching problem — so the same sequence also works like a **project** or **problem-based** unit (see the comparison below). TBLT applies most directly to the activities you build **for your learners**.
link: [Open the 11/11 activity board](../1111/#p-6)

## Is it a task? Sort the activity board
kind: section
Not every activity on the 11/11 board is a task. Some are **exercises** — useful practice of a form, but with no gap or outcome. Many can be turned into tasks with one change.

## Your turn
kind: step
do: Choose five activities from the [activity board](../1111/#p-6). For each, check the four criteria. Is it a task, a focused task or an exercise? If it is an exercise, what **one change** would make it a task? Then open the suggested answers.

## Suggested answers for seven activities
kind: reveal
- **L10 Listening jigsaw — task.** Each group holds different information (gap); the class must rebuild the whole talk (outcome).
- **S7 Story co-build — task**, output-based. The rule about tense and viewpoint adds a light focus on form.
- **S5 Mini-debate — almost a task.** There is an opinion gap, but no outcome. Add one: the pair must agree on a joint recommendation.
- **L3 Minimal-pair detective — exercise.** The focus is on a form (sounds) and there is no outcome beyond the answers. It is valuable task-supported practice.
- **R5 Headline match — exercise.** It becomes a task if learners choose which three stories go on a class news page and justify the choice.
- **W9 Email genre swap — focused exercise.** It becomes a task if learners write a real request to a real reader and the reply decides the outcome.
- **R10 Fact-check chain — close to a task.** Give it an outcome: "Decide whether to share this post, and tell a friend why."

## What the research says about TBLT
kind: section
Defining papers, a critique and the replies, a meta-analysis and reviews. Free full texts are linked where they are legal; the others are through the NTU library.

## Task-based language teaching: Sorting out the misunderstandings
kind: card
badge: Classic · 2009
key:
- Defines a task and argues there is **no single** task-based approach.
- Answers critics (Widdowson, Seedhouse, Sheen, Swan): many criticisms come from misunderstanding what a task is.
- Task-based teaching can be used **alongside** form-focused teaching, not only instead of it.
- Ends with genuine implementation problems seen in evaluation studies.
design:
- Use the four criteria to check your own activities.
basis: Abstract. The four criteria are the paper's definition of a task — check the exact wording there.
refs: ellis2009

## Legislation by hypothesis: The case of task-based instruction
kind: card
badge: Classic · critique · 2005
key:
- The claim that grammar is acquired by noticing during communication rests on **unproved hypotheses**.
- Tasks may develop command of language learners **already know**, but are weaker for teaching **new** language — especially with little class time and no English outside class.
- Warns against swinging between meaning-only and form-only teaching.
design:
- Read it with Taiwan's class hours in mind: where does new language come from in your task?
basis: Abstract.
refs: swan2005

## In defense of tasks and TBLT: Nonissues and real issues
kind: card
badge: Classic · 2016
key:
- Defines genuine TBLT as task-based throughout: needs analysis → target tasks → pedagogic tasks sequenced by complexity → task-based, criterion-referenced tests.
- Answers **14 criticisms**; most, he argues, are non-issues.
- Lists ten methodological principles — for example, learning by doing, rich input, focus on form, negative feedback.
- **Real issues** that remain: how to measure task complexity, how to assess task performance and whether it transfers to other tasks, and teacher education.
design:
- If a learner can do one task, can they do a similar one? This is the transfer question, and it applies to any task-based test or chatbot.
basis: Full text.
link: [⬇ Free PDF (Cambridge, free to read)](https://www.cambridge.org/core/services/aop-cambridge-core/content/view/ED5590DB727AE82E0A98AC05264B83E1/S0267190515000057a.pdf/div-class-title-in-defense-of-tasks-and-tblt-nonissues-and-real-issues-div.pdf)
refs: long2016

## Position paper: Moving task-based language teaching forward
kind: card
badge: Classic · 2017
key:
- Ten real issues, from "what is a task?" to feedback timing and teacher education.
- Distinguishes focused/unfocused and input-/output-based tasks; calls for more **input-based** tasks.
- Needs-based syllabuses are hard to apply in East Asian state schools.
- Proposes a **hybrid** syllabus: mainly task-based, with task-supported teaching for stubborn language problems.
design:
- Should your bot give feedback during the task or after it? Ellis treats this as an open question — decide and justify.
basis: Full text (author's submitted version).
link: [⬇ Author's version (Curtin University repository)](https://curate.curtin.edu.au/articles/Position_paper_Moving_task-based_language_teaching_forward/31664641)
refs: ellis2017

## Options in a task-based language-teaching curriculum
kind: card
badge: Recent · 2021
key:
- Compares four TBLT curricula: **Prabhu, Willis, Long and Ellis**.
- Offers questions to evaluate a curriculum and lists the options at each design stage.
- Notes the tension between what SLA theory says is needed and what a teaching context allows; asks for **flexibility**.
basis: Abstract.
refs: ellis2021

## TBLT implementation and evaluation: A meta-analysis
kind: card
badge: Meta-analysis · 2019
key:
- **52 studies** of TBLT programmes running over time in real classrooms.
- Overall effect on learning outcomes: **d = 0.93** — positive and strong.
- Effects varied with region, type of institution, whether a needs analysis was done, and how many cycles of implementation.
- Teachers' and learners' perceptions were positive.
design:
- Evidence for whole programmes, not single tasks — a reply to Swan's 2005 point that long-term evidence was lacking.
basis: Abstract.
refs: bryfonski2019

## The implementation of CLT and TBLT in the Asia-Pacific region
kind: card
badge: Review · 2011
key:
- Constraints at three levels: **conceptual** (local values, misconceptions), **classroom** (students, teachers, management, resources) and **societal–institutional** (curricula, exams).
- Successful TBLT in Asia needs **adaptation** to local practice.
design:
- Name the exam and class-size constraints your activity must work within.
basis: Abstract.
refs: butler2011

## Technology-mediated TBLT
kind: card
badge: Reviews · 2016 & 2020
key:
- **Ziegler (2016):** state-of-the-art review of how technology-mediated tasks support L2 development and performance, and how technology helps research task design and implementation.
- **Chong & Reinders (2020):** a grounded-theory synthesis of **16 classroom studies (2002–2017)** — the characteristics, affordances and limitations of technology-mediated TBLT, and what makes it work.
design:
- A chatbot or AI tool does not make an activity a task; the gap and the outcome do.
basis: Abstracts.
link: [⬇ Chong & Reinders, free (Language Learning & Technology, CC BY-NC-ND)](https://hdl.handle.net/10125/44739)
refs: ziegler2016 | chong2020

## Problem-based learning
kind: section
PBL began in medical education and spread to many disciplines. Learners work in groups on a real problem, find out what they need to know, and propose a solution.
refs: barrows1996 | savery2006 | strobel2009

## Overview of problem-based learning: Definitions and distinctions
kind: card
badge: Classic · 2006
key:
- PBL is a **learner-centred** approach in which learners do research, connect theory and practice, and apply knowledge and skills to develop a **viable solution to a defined problem**.
- Compares PBL with other experiential approaches, such as project-based and case-based learning, and names its challenges.
design:
- Read his distinctions before you call your unit "PBL".
basis: Abstract.
link: [⬇ Free (Interdisciplinary Journal of Problem-Based Learning)](https://doi.org/10.7771/1541-5015.1002)
refs: savery2006

## The guidance debate
kind: card
badge: Classic debate · 2006–2007
key:
- **Kirschner, Sweller & Clark (2006):** minimally guided instruction — they include PBL — is less effective and efficient than guided instruction; the advantage of guidance shrinks only when learners already know a lot.
- **Hmelo-Silver, Duncan & Chinn (2007):** PBL is not unguided discovery — it is **heavily scaffolded**, and it also aims at goals such as collaboration and self-directed learning.
design:
- Both sides agree on one thing: novices need guidance. Plan the scaffolds — models, sentence frames, checkpoints.
basis: Abstracts.
refs: kirschner2006 | hmelo2007

## When is PBL more effective?
kind: card
badge: Meta-synthesis · 2009
key:
- A qualitative synthesis of earlier meta-analyses comparing PBL with conventional teaching.
- PBL did better on **long-term retention**, **skill development** and **student and teacher satisfaction**.
- Conventional teaching did better on **short-term retention** measured by standardised board exams.
design:
- What you measure decides which approach "wins" — the same point Aryadoust makes about validity.
basis: Abstract.
link: [⬇ Free (Interdisciplinary Journal of Problem-Based Learning)](https://doi.org/10.7771/1541-5015.1046)
refs: strobel2009

## PBL in a web-based English reading course
kind: card
badge: Study · 2018
key:
- Two university classes were randomly assigned to a **web-based PBL** reading course or to teacher lectures.
- The PBL group, which searched the internet for solutions to a problem, scored significantly higher on a reading comprehension post-test.
- Questionnaires showed more active learning.
design:
- The author works at National Taiwan Ocean University. Only two classes were compared, so the teacher and class effects cannot be separated — a design to replicate, not a final answer.
basis: Abstract.
refs: lin2018

## Project-based language learning
kind: card
badge: Classic · 2005
key:
- Projects can develop **language, content and skills** together, but ESL students do not always see their value.
- The **Project Framework** makes the three goals explicit so that students see what they are learning.
design:
- Tell learners what language they are learning through the project, not only what they are making.
basis: Abstract.
refs: beckett2005

## TBLT and PBL compared
kind: section
This table is our comparison, drawn from the sources on this page. Both approaches are learner-centred and both start from meaning; they differ in **what the outcome is for**.

| | TBLT | PBL |
|---|---|---|
| Began in | Second language acquisition research and language teaching | Medical education |
| Unit of work | A task: a meaning-focused activity with a gap and an outcome | A real problem, usually complex and open, with no single answer |
| Main goal | Language development through using the language | Content knowledge, problem-solving, collaboration and self-directed learning |
| Role of language | The target of learning | The medium; in a language class it is both medium and target |
| Typical length | One lesson, or a sequence ending in an exit task | Several sessions to several weeks |
| Teacher | Designs and sequences tasks; focuses on form before, during or after | Facilitates and scaffolds the inquiry |
| Assessed by | Task completion, sometimes plus language quality | The solution and the process |
| Evidence | Positive programme effects (d = 0.93) | Better long-term retention and skills; weaker short-term exam retention |
| Main criticism | Little new language for learners with little exposure | Too little guidance for novices |
Sources: Ellis (2009, 2017); Long (2016); Bryfonski & McKay (2019); Swan (2005); Barrows (1996); Savery (2006); Kirschner et al. (2006); Hmelo-Silver et al. (2007); Strobel & van Barneveld (2009).

## Where they meet
kind: card
- **Problem-solving** is one of the common pedagogic task types in TBLT, so a PBL problem can be a large task.
- A PBL unit can be built from a **sequence of tasks** that ends in an exit task — the solution.
- In a language class, PBL needs a planned **language focus**, or the content can crowd out the language.
refs: ellis2017 | long2016 | beckett2005

## Choosing between them
kind: card
- **Beginners, little class time:** short tasks, input-based first, with task-supported practice of new language.
- **Higher proficiency, more time, content goals:** a problem or project, with scaffolds and a language focus.
- **Either way:** decide what evidence would show it worked — a task outcome, a language measure, or both.
refs: ellis2017 | swan2005 | kirschner2006

## Back to Aryadoust and the chatbot
kind: section

## Task-based assessment
kind: card
Norris (2016) argues that tasks are a strong — though not the only — basis for language tests, because they show what learners can **do** with the language. That raises Aryadoust's question: what does a task score mean, and does it predict performance on other tasks? The same questions apply to the GPT speaking examiner, which scores learners' performance in a conversation.
refs: norris2016 | long2016 | argval | gptspeak

## Make your chatbot a task
kind: card
Check your Mizou bot against the four criteria. A quiz bot asks questions with right answers; a **task** bot holds information the learner needs and asks for a decision.
refs: ellis2009 | ellis2017

## Mizou template · a task, not a quiz
kind: prompt
Pre-task, task and language focus in one bot. Change the scenario to fit your learners.
```text
You are a staff member at a youth hostel in [city]. The learner is planning a two-night class trip for [number] students with a budget of [amount].
Pre-task: greet the learner, explain the goal in one sentence, and offer three useful phrases for asking about prices and options.
Task: you know three rooms and two activities with prices and rules (invent them; keep them consistent). Give information only when asked. The learner must choose one room and one activity within budget and give a reason.
Do not correct language during the task, unless the learner cannot be understood; then ask a clarification question.
When the learner has decided, confirm the booking (the outcome).
Language focus: then show two sentences the learner wrote and a better version of each, and one phrase to use next time.
Use English at [level]. Keep every reply under 60 words. Do not ask for personal information.
```

## Questions for the discussion
kind: questions
- Which of the 40 board activities would Long count as tasks, and which would Ellis? Why do they differ?
- Swan says tasks teach little new language when class time is short. How would you answer him for a Taiwanese junior-high class?
- Is the way this course is built closer to TBLT or to PBL for **you**? For your future learners?
- What should a task-based test score — the outcome, the language, or both? What would Aryadoust ask about that score?

</script>
<script type="text/markdown" id="md9">
# Build a chatbot

Now turn the readings into practice. **Mizou** lets a teacher build a chatbot that learners talk to — with read-aloud and voice input, so it can run listening and speaking tasks. **Yoodli** is an AI speaking coach for adults: you use it yourself to rehearse a talk or a role-play and get feedback on your delivery.

<!--
HOW TO EDIT
  ## Title   kind: card · step · prompt (fenced ``` block) · section · checklist · questions
  Platform details were checked on 23 Nov 2026 — recheck before each semester.
-->

## Design rules from the readings
kind: section
Six findings to build into your bot. Each one comes from a paper on the earlier pages.

## Let learners choose and pace
kind: card
Topic choice, control over response time and the option to ask for clarification were built into the GPT examiner. Decide in advance how clarification requests count — they went with lower scores.
refs: gptspeak

## Design the feedback by level
kind: card
Feedback on the **task** (what was said), the **process** (how to improve) and **self-regulation** (how to plan and monitor next time). Test and revise the bot's instructions several times.
refs: ylgenai

## Keep a human in the loop
kind: card
Chatbots raise willingness to communicate, but do not build the whole repertoire of interaction skills. Pair bot practice with face-to-face talk, and check what the bot says.
refs: goh2025

## Check AI-written listening items
kind: card
AI writes good levelled scripts but weak items: long, with overlapping options, sometimes answerable without listening.
refs: llmlisten

## Make listening input realistic
kind: card
Spoken features, more than one accent, visuals, varied tasks, bottom-up and top-down processing, and a metacognitive step.
refs: lcbook

## Name the purpose
kind: card
Is the bot's feedback assessment **of**, **for** or **as** learning? The answer decides what evidence would show the bot works.
refs: argval

## The two platforms at a glance
kind: section
Checked on 23 November 2026. Both change often — check the pricing and terms pages before class.

| | Mizou | Yoodli |
|---|---|---|
| Who builds | The teacher builds a bot | Ready-made practice; custom role-plays mostly on organisation plans |
| Who uses it | Learners, through a link, **no learner account** | The account holder — you |
| Voice | Read-aloud and voice input on all plans | Live spoken role-plays, speeches and interviews; camera optional |
| Feedback | The bot's replies; rubric grading on paid plans | Delivery analysis, e.g. filler words and pacing; pronunciation feedback can be switched on |
| Free plan | 10 student sessions per day; no rubrics, timer or knowledge files | **5 practice sessions in total**, not per month |
| Age | Built for schools; the terms page was offline when we checked | Terms: **18 and over** |

## Mizou · build a listening or speaking bot
kind: section
Mizou's own help centre was offline when we checked, and the site now says *Mizou is now part of MeltingSpot*. The steps below follow the current site and recent teacher guides; labels may have moved.

## Sign up and look at an example
kind: step
do: Create a free teacher account at [mizou.com](https://mizou.com/education). Then open the [example module](https://mizou.com/module/1706790030516x865778483436453900) **while logged in** — logged-out visitors are sent to the home page.

## Start a new bot
kind: step
do: Choose **Custom** (start from scratch), a **Template**, or **AI-Generated** (enter a grade and learning objectives, then click *Get Ideas*). For this class, choose **Custom**.

## Fill in the fields
kind: step
do:
- **Standards:** title, grade level, learning objectives.
- **AI Instructions** and **Rules:** paste and edit a template below. Keep the instructions short — teacher guides report a limit of about 1,000 characters.
- **Customization:** the bot's name and a welcome message, which is the first thing learners see.
- **Tools:** turn on **Audio**, so learners can play the bot's messages aloud and answer by microphone.
tip: **Generate all fields** fills everything with AI — useful for a first draft, but rewrite it to match your design.

## Test it as a learner
kind: step
do: Run it on your phone with the audio on. Try a good answer, a weak answer, an off-topic answer and a request for help. Does the bot follow every rule?

## Publish and share
kind: step
do: Click **Publish** and choose whether the bot is public or visible only to you and your students. Start a session and copy its link; learners open it, type a first name and start. They do not need accounts.

## Read the transcripts
kind: step
do: In your bot's session list, open each learner's transcript. On paid plans Mizou also suggests a rubric grade. Read the transcripts yourself — this is your evidence of what the bot actually did.

## Mizou template · listening
kind: prompt
Read-aloud shows the text as well as playing it, so ask learners to **play first, then read**. This is a practice tool, not a listening test.
```text
You are a listening partner for [level, e.g. CEFR A2] learners of English.
Goal: learners understand the gist and key details of short spoken messages about [topic].
Each round:
1. Ask the learner to press play and listen before reading.
2. Say a 50–70-word message in natural spoken English (contractions, a filler, a self-correction).
3. Ask one gist question. After the answer, ask one detail question.
4. If wrong, give a hint about where to listen; do not give the answer at once.
5. After 3 rounds, ask: "What helped you understand? What will you listen for next time?"
Use words at [level]. One question per turn.
```

## Mizou template · speaking
kind: prompt
Based on the design choices in Aryadoust et al. (2026) and the feedback levels in Aryadoust & Zakaria (2026).
```text
You are a friendly speaking partner for [learners, level].
Goal: learners can [e.g. describe a plan and give two reasons].
1. Offer three topics; the learner chooses one.
2. Ask one short question per turn (max 2 sentences). Ask the learner to answer by microphone.
3. The learner may ask you to repeat or explain at any time; never penalise this.
4. When the learner makes an error, ask a clarification question or give a clue; do not give the correct sentence.
5. After 6 turns, give feedback in three short parts: Task (what you said well), Process (one thing to improve and how), Next time (one planning tip).
Never ask for personal information.
```

## A task bot
kind: card
For a bot built as a **task** — with an information gap, a decision and a language focus at the end — use the template on the [Tasks: TBLT & PBL](#p-8) page.

## Rules to add in either bot
kind: prompt
```text
Stay on the topic of [topic]. Use English at [level]. Keep every reply under 60 words.
If the learner writes in another language, answer briefly in simple English and continue.
Do not ask for names, schools, addresses or photos.
```

## Yoodli · rehearse your own speaking
kind: section
Use Yoodli to rehearse **your** presentation of this week's paper — not with school students: its terms require users to be 18 or over.

## Sign up
kind: step
do: Sign up at [app.yoodli.ai](https://app.yoodli.ai/home). The free plan gives **five practice sessions in total**; any speech, interview or role-play over 30 seconds counts as one.

## Check your settings first
kind: step
do: In settings, choose the **practice language** (English US, UK or Australian) and turn on **pronunciation feedback** if you want it. Opt out of your recordings being used to train Yoodli's AI if you prefer, and keep recordings private.

## Practise
kind: step
do:
- **Speech:** practice → speech → *Start*, speak after the countdown, then *Stop*.
- **Role-play:** practice → conversation → choose a scenario or *Personalize your conversation*, allow the microphone, *Start* and talk.
- **Interview:** enter a role, choose the interviewer's manner, optionally add your own questions.

## Read the analysis
kind: step
do: Click **View Analysis**. Look at filler words, pacing and word choice, and ask for an AI follow-up question if you want Q&A practice. Note one thing to change, then try again — that before-and-after is evidence for your portfolio.

## Share or delete
kind: step
do: In the **Recording Library**, use the three-dot menu to copy a share link, download or delete a recording.
tip: Yoodli has a **Builder** for custom role-plays, but personas, goals and custom rubrics are on Business and Enterprise plans. Check what your account shows.

## In class today
kind: section

## Build, swap, review
kind: step
time: 40 minutes
do:
- **Pairs (20 min):** build one Mizou bot — listening or speaking — from the templates. Write down which paper supports each design choice.
- **Swap (10 min):** use another pair's bot as a learner, with audio on. Note one thing that worked and one rule the bot broke.
- **Review (10 min):** read your bot's transcripts and revise its instructions once. Keep both versions.

## Rehearse
kind: step
time: 15 minutes
do: Each person rehearses a **two-minute talk** on their paper in Yoodli — research question, method, one finding, one implication. Use one free session only, and keep the analysis for your portfolio.

## Before you use either tool
kind: checklist
- No real learner names, voices or work go into either tool without consent
- Age rules checked for the learners who would use the bot
- The bot's instructions forbid asking for personal information
- I read the transcripts and checked what the bot said
- I can name the paper behind each design choice

## Evaluate your bot
kind: questions
- What is your bot's purpose — assessment of, for or as learning — and what evidence from the transcripts shows it served that purpose?
- Which of the six design rules did your bot follow, and which did it break?
- What would you change before using it with real learners?

## argval
title: A critical assessment of the argument-based validity framework
short: Aryadoust & Zakaria (2026)
cite: Book chapter in *Effective Assessment in Schools* (Routledge)
badge: Book chapter · 2026
themes: teach | test
home: 2 | 6
rq: Aim (from the abstract): to interrogate the argument-based validity framework that dominates validation theory in language assessment — its relevance for practice and its limitations.
method: A conceptual chapter. It traces how mainstream validity theory developed and surfaces its assumptions, then contrasts validity as understood in educational measurement (**assessment of learning**) with ideas of validity developed from classroom practice (**assessment for learning** and **assessment as learning**).
found:
- The dominant framework grew out of measurement for ranking and certifying; its assumptions do not automatically fit classroom assessment.
- How you define validity shapes what you count as good assessment practice.
- The authors invite readers to rethink validity for their own contexts and suggest ways this rethinking can improve practice.
design:
- Before building a quiz or rubric, decide its **purpose**: to rank (of learning), to guide teaching (for learning) or to help learners regulate themselves (as learning). Each purpose needs different evidence.
- For a classroom AI chatbot that gives feedback, the key validity question is whether learners can *use* the feedback, not only whether its scores are accurate.
basis: Publisher abstract only.
access: No free full text — use the NTU library or interlibrary loan.
refs: argval

## relmeta
title: A meta-analysis of the role of reliability in inter-construct correlations in second language research
short: Zhao & Aryadoust (2026)
cite: *Educational Assessment*, advance online publication
badge: Meta-analysis · 2026
themes: test | R
home: 2 | 5
rq: Aim (from the abstract): how does the reliability of a test condition the size of the correlations researchers observe between that test and other constructs?
method: Meta-analysis of **49 studies (1999–2025)**: 58 Cronbach's alpha estimates and 463 correlations between **reading comprehension tests** and 13 other language-related measures, analysed with robust variance estimation to handle dependent effect sizes.
found:
- Cronbach's alpha significantly predicted the size of inter-construct correlations (*t*(21.74) = 2.35, *p* = .03).
- Less reliable reading tests systematically produced **weaker (attenuated) correlations** with other measures.
- Measurement error does not just add noise; it limits what relationships researchers can observe.
design:
- A short or poorly written classroom test can make two skills look unrelated when they are related. Report reliability before interpreting any correlation.
- When you read a study claiming "vocabulary hardly predicts reading", check the reliability of its tests first.
basis: Publisher abstract only.
access: No free full text yet (published online October 2026).
refs: relmeta

## typology
title: The typology of second language listening constructs: A systematic review
short: Aryadoust & Luo (2023)
cite: *Language Testing*, 40(2)
badge: Systematic review · 2023
themes: test | teach | L
home: 3 | 2
rq: Aim (from the abstract): how have L2 listening constructs been conceptualized (defined) and operationalized (measured) in published research?
method: Systematic review of **157 peer-reviewed papers in 19 applied linguistics journals**, coded for publication details and reliability, and for the listening subskills, cognitive processes, attributes and listening functions each study measured or investigated.
found:
- Only **39 papers (24.84%)** gave a theoretical definition of listening, and 38 of those were general or narrow.
- Listening functions such as **discriminative, empathetic and analytical listening** were largely ignored.
- The studies operationalized **24 subskills, 27 cognitive processes and 54 listening attributes** (105 features).
- The authors built a **multilayered framework**: subskills and processes in five groups each, attributes in three groups.
design:
- Write down what *kind* of listening your task targets before you write the questions — gist, detail, inference, or a listening function such as empathetic listening.
- Use the framework as a checklist so a listening test does not measure only one narrow slice of the skill.
basis: Publisher abstract only.
access: The NIE repository record says an open version is at the publisher; we could not confirm it. Try the DOI link on campus.
refs: typology

## subskills
title: A review of comprehension subskills: A scientometrics perspective
short: Aryadoust (2020)
cite: *System*, 88, Article 102180
badge: Scientometric review · 2020
themes: test | teach | L | R
home: 3 | 5 | 7
rq: Aim (from the paper): no universally accepted taxonomy of listening and reading **comprehension subskills** exists, so the study (i) identifies influential publications on comprehension subskills objectively, through keyword searches and citation analysis, and (ii) reviews their content to list the subskills that have been empirically investigated.
method: **Document co-citation analysis** of 192 publications (Scopus and Web of Science, merged), with timeline visualization, burst detection and automatic cluster labelling; then a close reading of the influential publications in each cluster.
found:
- **18 substantial research clusters** containing **73 empirically investigated subskills** — 55 in L1 comprehension, only 18 in L2.
- 15 clusters (83.33%) focused on **lower-order L1 reading** abilities such as orthographic processing and speeded word reading.
- The subskills were drawn as a **codex**, the first integrative framework of empirically investigated comprehension subskills.
- Experimental research on **L2** comprehension subskills is needed.
design:
- Teachers of young L2 learners can include activities that teach and check lower-level abilities — phonological awareness, rapid naming, lexical access — to find learners' gaps.
- Use the codex and its reference clusters to choose which subskill a reading or listening item should target.
basis: Author's accepted manuscript (full text).

access: Free · accepted manuscript, NIE repository

## lcbook
title: An evaluation framework for second language listening coursebooks: Principles and practice
short: Zhai et al. (2026)
cite: *TEFLIN Journal*, 37(1)
badge: Materials framework · 2026
themes: mat | teach | L | AI
home: 3
rq: "(1) What good qualities should listening texts and tasks exhibit? (2) What cognitive processes should listening tasks engage learners in? (3) What level of difficulty should listening texts present to support learning?"
method: A conceptual framework grounded in listening comprehension, listening assessment and SLA theory. **Seven principles**, each with a guiding question and indicators, illustrated on Units 1–4 of *Listen This Way* (Level 4), a coursebook for second-year English majors in mainland China; text difficulty checked with Text Inspector.
found:
- The seven principles — texts: (1) authentic spoken features, (2) diverse accents, (3) multimodal, (4) difficulty matched to learners; tasks: (5) varied and real-world, (6) bottom-up **and** top-down processing, (7) metacognitive awareness.
- The coursebook met principles 1, 4 and 6, but used only British and American accents, offered few visuals, had no integrated listen-to-speak or listen-to-write tasks, and did little for metacognitive awareness.
design:
- Use the seven principles to evaluate — and then adapt — any listening material, including the materials you designed this semester.
- Fill gaps with unscripted podcasts, other accents of English, video, integrated tasks, listening diaries and self-assessment checklists.
- Generative AI can draft texts and tasks, synthesize several accents and make video — always with human checking.
- The authors note that the framework is conceptual and not yet empirically validated.
basis: Full text.
download: https://journal.teflin.org/index.php/journal/article/download/3375/456
access: Free · published version, CC BY-SA

## llmlisten
title: Investigating the affordances of OpenAI's large language model in developing listening assessments
short: Aryadoust, Zakaria & Jia (2024)
cite: *Computers and Education: Artificial Intelligence*, 6, Article 100204
badge: Empirical study · 2024
themes: test | mat | L | AI
home: 3 | 7 | 2
rq: Aim (from the abstract): can ChatGPT 4 write listening scripts and test items for test takers at different proficiency levels (academic, low, intermediate, advanced), to reduce the cost and complexity of listening test development?
method: Prompt engineering and step-by-step refinement of prompts to generate scripts and items on **24 topics** taken from academic listening tests. Scripts were analysed linguistically with **Coh-Metrix and Text Inspector**; items were analysed for topic variation and overlap. Goh & Aryadoust (2025) report the output as 96 scripts and 384 multiple-choice items.
found:
- ChatGPT 4 **reliably varied the scripts' language** by level, as the prompts required.
- The **items were weaker**: often long, with options that overlapped in meaning; quality also depended on the topic.
- Goh & Aryadoust (2025) add that many options could be eliminated through world knowledge alone.
design:
- AI is a good **script writer** for levelled listening texts; check them with a text profiler.
- Treat AI-written **items** as drafts: shorten them, remove overlapping options, and check that no item can be answered without listening.
- The paper also discusses the ethical questions of using GenAI in assessment.
basis: Abstract; item counts and the world-knowledge finding as reported in Goh & Aryadoust (2025).
download: https://www.sciencedirect.com/science/article/pii/S2666920X24000055
access: Free · open access, CC BY-NC-ND (download on the publisher page)

## goh2025
title: Developing and assessing second language listening and speaking: Does AI make it better?
short: Goh & Aryadoust (2025)
cite: *Annual Review of Applied Linguistics*, 45
badge: Review · 2025
themes: teach | test | L | S | AI
home: 3 | 4 | 7
rq: Aim: how can AI — especially generative AI — support the teaching, learning and assessment of L2 listening and speaking, and what are its limits? (A review with no numbered research questions.)
method: A critical narrative review organised around models of listening (perception, parsing, utilization) and speaking (conceptualization, formulation, articulation), covering spoken dialogue systems, personal assistants, chatbots, custom GPTs and AI-generated tests.
found:
- Listening has received less GenAI attention than other skills; studies of voice assistants mostly found no significant listening gains.
- Chatbots and spoken dialogue systems consistently **raise willingness to communicate and lower anxiety**, but evidence of actual language development is thin.
- AI-generated listening tests have **authenticity and cognitive-validity problems**.
- Custom GPTs can give corrective, recast and self-regulation feedback, or act as a speaking examiner.
- Risks: privacy of voice and student data, especially for young learners, and hallucination.
design:
- Use GenAI for **assessment for and as learning** — personalised materials, immediate feedback, support for self-regulation — not only for ranking.
- Let learners repeat speaking tasks with an AI partner, but keep face-to-face interaction: AI talk does not build the full repertoire of interaction skills.
- Use AI for pre-task planning (ideas, vocabulary), not for scripts; teach AI literacy; keep the teacher as **the human in the loop**, evaluating AI tools as carefully as textbooks.
basis: Full text.

access: Free · published version, CC BY-NC-ND

## gptspeak
title: Automatic conversational assessment using a GPT-based model for EAP speaking
short: Aryadoust et al. (2026)
cite: *English for Specific Purposes*, 84
badge: Empirical study · 2026
themes: test | S | AI
home: 4 | 2 | 7
rq: Aim (from the abstract): how can a conversational agent, customized through advanced prompting in OpenAI's **GPT Builder**, be used to assess speaking in English for academic purposes? The system was built around four dimensions: measurement definition, system design, performance evaluation and learner experience.
method: First-year English majors from two large universities took a GPT-run speaking assessment in which they could **choose topics, control their response time and ask for clarification**. GPT and human ratings were compared with **many-facet Rasch measurement** and linear mixed-effects models, across eight scoring categories.
found:
- GPT was a **mid-range rater in severity**; mean differences from human raters were not significant.
- **3 of the 8 scoring categories** differed significantly between GPT and human ratings.
- GPT scoring was acceptably consistent and reliable, with typical rater habits such as avoiding extreme scores.
- Students who asked for clarification tended to score lower; students who spoke longer tended to score higher.
- Students' views of GPT did not affect their scores.
design:
- A custom GPT examiner is a realistic option for **formative** speaking assessment, especially where learners choose topics and pace.
- Check its ratings against human raters category by category: agreement overall can hide disagreement on specific criteria.
- Decide in advance how clarification requests should count — the study found they went with lower scores.
basis: Abstract only (the sample size and category names were not available to us).
download: https://www.sciencedirect.com/science/article/pii/S0889490626000451
access: Free · open access, CC BY-NC (download on the publisher page); a preprint is also on SSRN

## ylgenai
title: Formative assessment of speaking for young learners using customized generative AI
short: Aryadoust & Zakaria (2026)
cite: Book chapter in *Second Language Oracy Development for Young Learners* (Springer)
badge: Book chapter · 2026
themes: teach | test | S | AI
home: 4 | 7
rq: Aim (from the chapter page): how can a customized generative AI (ChatGPT) be designed to provide formative speaking assessment for young learners?
method: A conceptual and design chapter grounded in communicative competence theory and models of formative feedback. It walks through building a customized GPT — **task specifications, tone, feedback design and iterative testing** — with sample interactions and classroom uses.
found:
- Direct and semi-direct speaking tests struggle with feasibility, cost and construct underrepresentation; speaking needs an interlocutor.
- A customized GPT can give feedback at the **task, process, self-regulation and self** levels; learners can review their speech through transcripts.
- Limits: data privacy, **age restrictions**, no multimodal input, and the transparency and reliability of automated scoring.
- It "cannot replace human interlocutors" but can extend speaking practice at low cost.
design:
- Design the bot's feedback by level: what to say about the task, about the process, and about the learner's own planning and monitoring.
- Check the tool's age rules before children use it; young learners usually need a teacher-run setup.
basis: Chapter abstract page only.
access: No free full text — use the NTU library.

## visflu
title: Investigating the role of AI-generated visual input in predicting perceived fluency
short: Jia & Aryadoust (2026, preprint)
cite: SSRN preprint — not yet peer reviewed
badge: Preprint · 2026
themes: test | S | AI
home: 4 | 2
rq: Aim (from the abstract): does visual input change how raters perceive speech fluency — their ratings and their response times — and how do response times relate to ratings?
method: Within-subjects experiment: **82 participants rated 30 AI-generated speech stimuli**, each presented in audio-only and audiovisual conditions in random order; linear mixed-effects models plus correlations.
found:
- AI-generated visual input **sped up raters' responses but did not change fluency ratings**.
- The authors suggest matching visuals give "redundant" information already in the audio.
- Response time correlated with ratings in simple correlations, but not once rater and stimulus variation were controlled.
design:
- Adding a talking-head video to a speaking task may change *how* raters work without changing scores — useful evidence when choosing between audio and video formats.
- AI-generated speakers can be research and practice material, with limits the authors discuss.
- Simple correlations can mislead when each rater scores many samples.
basis: Abstract only. This is a preprint; check whether a peer-reviewed version has appeared before citing it.

access: Free · preprint on SSRN

## ann
title: Does EFL readers' lexical and grammatical knowledge predict their reading ability? Insights from a perceptron artificial neural network study
short: Aryadoust & Baghaei (2016)
cite: *Educational Assessment*, 21(2)
badge: Empirical study · 2016
themes: test | R | AI
home: 5 | 2 | 7
rq: Aim (from the abstract): how well do EFL learners' vocabulary and grammar knowledge distinguish low- from high-ability readers?
method: **825 test takers** took an L2 reading test plus validated grammar and vocabulary tests; abilities were estimated with the **Rasch model**; a multilayer **perceptron artificial neural network** classified readers as low or high ability from their grammar and vocabulary measures.
found:
- The network correctly classified about **78% of readers** from vocabulary and grammar alone.
- **Vocabulary** was more strongly associated with reading comprehension than grammar.
- The results fit cognitive theories that treat lexical and grammatical knowledge as a major difference between poor and competent readers.
design:
- Vocabulary and grammar tests can serve as a quick screening of reading readiness — but about one reader in five would be misclassified, so do not use them alone.
- In reading materials, vocabulary support is the first lever to pull.
- An early example of machine learning in language assessment, years before generative AI.
basis: Publisher abstract only.
access: No free full text — use the NTU library.

## awesr
title: A systematic review of automated writing evaluation systems
short: Shi & Aryadoust (2023)
cite: *Education and Information Technologies*, 28(1)
badge: Systematic review · 2023
themes: test | W | AI
home: 6 | 2
rq: "1. What are the study contexts and the trends of AWE scoring … 2. Which validity inferences have been investigated in the identified AWE studies? 3. What methodologies were adopted in the AWE studies to investigate each validity inference? 4. What areas of investigation have been studied to provide evidence of backing or rebuttals for each inference?"
method: Systematic review of **105 published papers on automated writing evaluation (AWE) scoring** from Scopus, coded within an **argument-based validation framework** (domain description, evaluation, generalization, explanation, extrapolation, utilization).
found:
- Research is growing and spans many settings, languages and educational levels.
- Coverage of the validity inferences is uneven: **evaluation** (scoring accuracy) is studied most; **domain description** is neglected.
- Most studies were quantitative and positive, but **counter-evidence appeared for every inference**.
design:
- Replacing human raters with AWE is not justified; combine AWE with human scoring for high-stakes use, or use it as an independent rater for immediate formative scores.
- Before adopting a tool, ask what writing **domain** it was built for and whether that matches your learners' tasks.
basis: Author's accepted manuscript (full text).
note: The published record lists the first author's name as "Huawei, S."; a correction was issued, and the author's name is Huawei Shi.

## awfsr
title: A systematic review of AI-based automated written feedback research
short: Shi & Aryadoust (2024)
cite: *ReCALL*, 36(2)
badge: Systematic review · 2024
themes: teach | test | W | AI
home: 6 | 7 | 2
rq: "1. What are the research contexts in AWF studies … 2. What types of AWF provided by AWF systems were investigated, and in what ways was AWF utilized in these studies? 3. How can the published AWF research be characterized in terms of the research design … 4. What are the foci of investigation in the studies, and what results are found?"
method: Systematic review (PRISMA) of **83 SSCI articles (85 studies, 1993–2022)** from Scopus, coded on 4 categories and 17 variables; intra-coder agreement above κ = .90; findings interpreted through the argument-based validity framework.
found:
- 82.4% of studies were at university level; English was the target language in 82 of 85.
- **31 systems**, led by Pigai, Criterion and Grammarly; 57.6% of studies looked at **form-focused** feedback, only 15 at meaning.
- 14 ways of using AWF — most often on its own, sometimes compared with teacher or peer feedback.
- Effects on writing were mostly positive (30 of 38 studies), but **validation of AWF accuracy had the least research and the weakest results**.
design:
- Form-focused AWF cannot cover the whole writing construct; add teacher or peer feedback on content, organisation and coherence.
- AWF "may hardly be the equivalent of or replacement for" human feedback — decide whether your tool supplements or replaces.
- Check a tool's stated users, levels and genres before using it; the authors point to generative AI for higher-order feedback.

## callsci
title: A scientometric review of research trends in computer-assisted language learning (1977–2020)
short: Lim & Aryadoust (2022)
cite: *Computer Assisted Language Learning*, 35(9)
badge: Scientometric review · 2022
themes: teach | mat
home: 7
rq: Aim (from the abstract): what have been the main research trends in CALL from 1977 to 2020, and how much support is there for the technologies studied?
method: **Document co-citation analysis** of **3,697 studies in 11 journals** (Scopus), with burst index and betweenness centrality to identify influential publications, then content analysis of those publications.
found:
- **Seven major research clusters**.
- Stronger support for **synchronous computer-mediated communication and negotiated interaction, multimedia, telecollaboration or e-mail exchange, and digital games**.
- Weaker support, and some major drawbacks, for **blogs, wikis and podcasts**.
design:
- When choosing a technology for a lesson, start from the clusters with stronger evidence, and ask what kind of interaction the tool creates.
- The study is also a ready-made map of research topics for your final project.
basis: Publisher abstract only.
access: No free full text — use the NTU library.

## dst
title: A systematic review of digital storytelling in language learning in adolescents and adults
short: Lim, Zakaria & Aryadoust (2022)
cite: *Education and Information Technologies*, 27(5)
badge: Systematic review · 2022
themes: teach | mat | L | S | R | W
home: 7 | 6
rq: "1. What are the research topics and methods that have been adopted in previous DST research? 2. What are the theories or frameworks of DST that have been adopted in previous DST research? 3. How were the studies designed in terms of the reliability of the instruments used? 4. How do the outcomes of using DST vary across the four language skills and variables in the coding scheme?"
method: Systematic review of digital storytelling (DST) studies with adolescents and adults found in Scopus — 71 papers in the dataset, 58 after removing 13 repeated entries — coded for topics, methods, theories, reliability and outcomes in the four skills.
found:
- Combining several data-collection methods was the most common approach (23 of 58 studies, 39.7%); most studies neither tested nor mentioned a theory or framework.
- **Close to 90% of studies reported no reliability testing** of their instruments.
- Most reported positive outcomes, but "not all claims were supported with evidence"; listening and speaking studies were few.
design:
- Digital storytelling is promising for all four skills, but the evidence is weaker than its popularity suggests.
- If you use it, define the components (images, audio, script), the skill you are developing and how you will measure it — reliably.

  const items=parts.map(block=>{

    const f={},bullets=[],body=[];let cur=null,inCode=false;
    for(const line of rest.split("\n")){
      if(/^```/.test(line)){inCode=!inCode;body.push(line);cur=null;continue}

      const m=line.match(/^([a-z][a-z0-9_]*):[ \t]*(.*)$/);
      if(m){const k=m[1],v=m[2].trim();if(v){f[k]=v;cur=null}else{f[k]=[];cur=k}continue}

  });

    inner+="<ul>"+it.bullets.map(b=>"<li>"+inline(b)+"</li>").join("")+"</ul>";

  if(it.f.link) inner+='<p style="margin:.6rem 0 0">'+inline(it.f.link)+"</p>";
  if(it.f.refs) inner+='<div style="margin-top:.5rem">'+chips(it.f.refs)+"</div>";
  return '<article class="card kind-'+k+(k==="step"?" step":"")+'">'+inner+"</article>";
}
function renderItems(items){
  let out="",group=null,buf=[];
  const flush=()=>{ if(!buf.length) return;
    const k=group, cls=k==="step"?"steps":k==="milestone"?"timeline":"grid"+(["prompt","wide"].includes(k)?" wide":"");
    out+='<div class="'+cls+'">'+buf.join("")+"</div>"; buf=[]; };
  for(const it of items){
    const k=it.f.kind||"card";
    if(k==="section"||k==="matrix"){flush();group=null;out+=itemHtml(it);continue}
    const g=(it.f.wide==="yes"||k==="prompt"||k==="sample"||k==="reveal")?"wide":(k==="step"||k==="milestone"?k:"grid");
    if(g!==group){flush();group=g}
    buf.push(itemHtml(it));
  }
  flush(); return out;
}

const SKILLS={L:["Listening","M3 18v-6a9 9 0 0 1 18 0v6|M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"],
  S:["Speaking","M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z|M8 9h8M8 13h5"],
  R:["Reading","M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z|M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"],
  W:["Writing","M12 20h9|M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"]};
const TOOLCOL=["#3E6B77","#B9752B","#5C7A3C","#A8442A","#6B5B95","#2F7F6F","#8A6D1F","#4F6D9A","#7A4E3A"];
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+SKILLS[k][1].split("|").map(d=>'<path d="'+d+'"/>').join("")+"</svg>";
const BOARD={acts:[],tools:[],tags:[],skill:"all",tool:null,model:false};
const bstate=()=>store.get(CONFIG.storeKey+"-board",{map:{},ws:{}});
const bsave=st=>store.set(CONFIG.storeKey+"-board",st);
function boardHtml(d){
  const acts=d.items.filter(x=>x.f.kind==="act"), tools=d.items.filter(x=>x.f.kind==="tool"), tagIt=d.items.find(x=>x.f.kind==="tags");
  BOARD.acts=acts.map(a=>({code:a.title,skill:a.f.skill,name:a.f.name||"",how:a.f.how||""}));
  BOARD.tools=tools.map((t,i)=>({id:t.title,name:t.f.name||t.title,col:TOOLCOL[i%TOOLCOL.length],mono:t.f.mono||(t.f.name||t.title).split(/[\s·]+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).join("").slice(0,2)||t.title.slice(0,2).toUpperCase(),model:list(t.f.model),f:t.f}));
  BOARD.tags=tagIt?tagIt.bullets.map(b=>{const m=b.split(/\s+—\s+/);return {tag:m[0],what:m[1]||""}}):[];
  const rest=d.items.filter(x=>!["act","tool","tags"].includes(x.f.kind));
  let h=renderItems(rest);
  h+='<div class="board" id="board"><div class="bbar">'+
    '<div class="brow"><span class="lbl">Skill</span><button class="sk" data-skill="all" aria-pressed="true">All forty</button>'+
      Object.keys(SKILLS).map(k=>'<button class="sk" data-skill="'+k+'" aria-pressed="false" style="--c:var(--'+k+')">'+icon(k)+SKILLS[k][0]+"</button>").join("")+"</div>"+
    '<div class="brow"><span class="lbl">Tool</span>'+BOARD.tools.map(t=>'<button class="tl" data-tool="'+esc(t.id)+'" aria-pressed="false" title="'+esc(t.f.by||"")+'"><span class="mono" style="background:'+t.col+'">'+esc(t.mono)+"</span>"+esc(t.name)+"</button>").join("")+"</div>"+
    '<div class="brow"><div class="meter" id="meter"></div><span style="flex:1"></span>'+
      '<button class="pill" id="bModel" aria-pressed="false">Show a model mapping</button><button class="pill" id="bCopy">Copy my matches</button><button class="pill" id="bClear">Clear</button><span class="status" id="bStatus"></span></div>'+
    '<div class="bhint" id="bhint"></div></div>'+
    Object.keys(SKILLS).map(k=>'<section class="skillblock" data-block="'+k+'" style="--c:var(--'+k+')"><div class="skillhead"><span class="ico">'+icon(k)+'</span><h3>'+SKILLS[k][0]+'</h3><span class="cnt" data-cnt="'+k+'"></span></div><div class="tiles">'+
      BOARD.acts.filter(a=>a.skill===k).map(a=>'<button class="tile" data-act="'+esc(a.code)+'"><span class="code">'+esc(a.code)+'</span><span class="nm">'+inline(a.name)+'</span><span class="hw">'+inline(a.how)+'</span><span class="tags"></span></button>').join("")+"</div></section>").join("")+
    "</div>";
  h+='<h3 class="sec">The nine tools</h3><div class="sec-body">Try each one before you match it. The tags under each card show the model mapping — open them only after your own sorting.</div><div class="toolcards">'+
    BOARD.tools.map(t=>'<article class="card toolcard" style="--tc:'+t.col+'"><h4>'+esc(t.name)+'</h4><div class="by">'+esc(t.f.by||"")+"</div>"+
      (t.f.what?'<div class="field"><span class="flabel">What it does</span>'+inline(t.f.what)+"</div>":"")+
      (t.f.mind?'<div class="field"><span class="flabel">Before you use it</span>'+inline(t.f.mind)+"</div>":"")+
      '<p style="margin:.5rem 0 0"><a href="'+esc(t.f.url)+'" target="_blank" rel="noopener">Open '+esc(t.name)+" ↗</a>"+(t.f.link?" · "+inline(t.f.link):"")+"</p>"+
      '<details style="margin-top:.5rem"><summary class="small muted" style="cursor:pointer">Model mapping</summary><div class="fits">'+t.model.map(c=>"<span>"+esc(c)+"</span>").join("")+'</div><p class="small" style="margin:.4rem 0 0">'+inline(t.f.why||"")+"</p></details></article>").join("")+"</div>";
  if(BOARD.tags.length) h+='<h3 class="sec">Theory tags</h3><div class="sec-body">Shorthand for your justification — choose one to three.</div><div class="tagrow">'+BOARD.tags.map(t=>'<span class="tg"><b>'+esc(t.tag)+"</b>"+esc(t.what)+"</span>").join("")+"</div>";
  h+='<h3 class="sec">Our group\'s activity</h3><div class="sec-body">The one activity you will build and show. It saves in this browser; copy it into your group document.</div>'+
    '<div class="card ws" id="ws"><label>Activity<select data-ws="act"><option value="">Choose…</option>'+
      Object.keys(SKILLS).map(k=>'<optgroup label="'+SKILLS[k][0]+'">'+BOARD.acts.filter(a=>a.skill===k).map(a=>'<option value="'+esc(a.code)+'">'+esc(a.code+" · "+a.name)+"</option>").join("")+"</optgroup>").join("")+"</select></label>"+
    '<div class="autotools" id="wsTools"></div>'+
    '<label>Why this activity type? (skill and activity in one line)<input type="text" data-ws="why"></label>'+
    '<div><span class="flabel">Theory tags (1–3)</span><div class="chkrow">'+BOARD.tags.map(t=>'<label><input type="checkbox" data-wstag="'+esc(t.tag)+'">'+esc(t.tag)+"</label>").join("")+"</div></div>"+
    '<label>How we will use it (one sentence)<textarea data-ws="how"></textarea></label>'+
    '<div class="copyrow"><button class="pill" id="wsCopy">Copy worksheet</button><span class="status"></span></div></div>'+
    '<div class="card kind-note" style="margin-top:.8rem">Presentation opener: <em>"Here\'s our activity [code + name] using [tools or our page]. We chose it because [one line]; theory tags [list]; quick demo: [10–20 seconds]."</em></div>';
  return h;
}
function paintBoard(){
  const st=bstate(), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t]));
  $$("#board .sk").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.skill===BOARD.skill)));
  $$("#board .tl").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tool===BOARD.tool)));
  $$("#board .skillblock").forEach(s=>s.hidden=BOARD.skill!=="all"&&s.dataset.block!==BOARD.skill);
  $("#bModel").setAttribute("aria-pressed",String(BOARD.model));
  $("#bModel").textContent=BOARD.model?"Hide the model mapping":"Show a model mapping";
  const active=BOARD.tool&&byId[BOARD.tool];
  $$("#board .tile").forEach(el=>{
    const c=el.dataset.act, mine=(st.map[c]||[]).filter(id=>byId[id]);
    const model=BOARD.model?BOARD.tools.filter(t=>t.model.includes(c)&&!mine.includes(t.id)):[];
    el.querySelector(".tags").innerHTML=mine.map(id=>'<span style="background:'+byId[id].col+'" title="'+esc(byId[id].name)+'">'+esc(byId[id].mono)+"</span>").join("")+
      model.map(t=>'<span class="model" title="Model: '+esc(t.name)+'">'+esc(t.mono)+"</span>").join("");
    el.classList.toggle("matched",mine.length>0);
    el.classList.toggle("hit",!!active&&mine.includes(active.id));
    el.classList.toggle("cand",!!active&&BOARD.model&&active.model.includes(c)&&!mine.includes(active.id));
    el.setAttribute("aria-pressed",String(!!active&&mine.includes(active.id)));
    el.setAttribute("aria-label",c+" "+el.querySelector(".nm").textContent+(mine.length?", matched with "+mine.map(id=>byId[id].name).join(", "):""));
  });
  const n=BOARD.acts.filter(a=>(st.map[a.code]||[]).some(id=>byId[id])).length;
  $("#meter").innerHTML='<span class="dots">'+[0,1,2,3,4].map(i=>'<i class="'+(i<n?"on":"")+'"></i>').join("")+"</span><span><b>"+n+"</b> "+(n===1?"activity":"activities")+" matched"+(n>=5?" — goal reached":" · goal: 5")+"</span>";
  Object.keys(SKILLS).forEach(k=>{const el=document.querySelector('[data-cnt="'+k+'"]'); if(el) el.textContent=BOARD.acts.filter(a=>a.skill===k&&(st.map[a.code]||[]).length).length+" of 10 matched";});
  $("#bhint").innerHTML=active?"Now click every activity <b>"+esc(active.name)+"</b> could serve. Click again to remove it.":"Choose a tool above, then click activities to match it.";
  const ws=st.ws||{}, a=BOARD.acts.find(x=>x.code===ws.act);
  $("#wsTools").innerHTML=a?"Tools matched to "+esc(a.code)+": "+(((st.map[a.code]||[]).filter(id=>byId[id]).map(id=>esc(byId[id].name)).join(", "))||"none yet — match some on the board, or plan to build your own page."):"";
}
function initBoard(){
  if(!$("#board")) return;
  const st=bstate(), ws=st.ws||{};
  $$("#ws [data-ws]").forEach(el=>{el.value=ws[el.dataset.ws]||""});
  $$("#ws [data-wstag]").forEach(el=>{el.checked=(ws.tags||[]).includes(el.dataset.wstag)});
  const hdr=()=>document.documentElement.style.setProperty("--hdr",$("header.top").offsetHeight+"px"); hdr(); window.addEventListener("resize",hdr);
  $("#board").addEventListener("click",e=>{
    const sk=e.target.closest("[data-skill]"); if(sk){BOARD.skill=sk.dataset.skill;return paintBoard();}
    const tl=e.target.closest("[data-tool]"); if(tl){BOARD.tool=BOARD.tool===tl.dataset.tool?null:tl.dataset.tool;return paintBoard();}
    const ti=e.target.closest("[data-act]");
    if(ti){ if(!BOARD.tool){$("#bhint").innerHTML="<b>Choose a tool first</b> — then click the activities it could serve.";return;}
      const s=bstate(), c=ti.dataset.act, arr=s.map[c]||[], i=arr.indexOf(BOARD.tool);
      if(i<0) arr.push(BOARD.tool); else arr.splice(i,1); s.map[c]=arr; bsave(s); return paintBoard(); }
  });
  $("#bModel").onclick=()=>{BOARD.model=!BOARD.model;paintBoard()};
  $("#bClear").onclick=()=>{ if(!confirm("Clear all your matches on this board?")) return; const s=bstate(); s.map={}; bsave(s); paintBoard(); };
  const say=(el,t)=>{el.textContent=t;setTimeout(()=>el.textContent="",2500)};
  const copy=(text,el)=>(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>say(el,"Copied.")).catch(()=>say(el,"Copy failed — select and copy by hand."));
  $("#bCopy").onclick=()=>{
    const s=bstate(), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t.name]));
    const lines=BOARD.acts.filter(a=>(s.map[a.code]||[]).some(id=>byId[id])).map(a=>a.code+" "+a.name+": "+s.map[a.code].filter(id=>byId[id]).map(id=>byId[id]).join(" + "));
    copy(lines.length?"Activity board matches ("+lines.length+")\n"+lines.join("\n"):"No matches yet.",$("#bStatus"));
  };
  const saveWs=()=>{const s=bstate(); s.ws={tags:$$("#ws [data-wstag]").filter(x=>x.checked).map(x=>x.dataset.wstag)}; $$("#ws [data-ws]").forEach(el=>s.ws[el.dataset.ws]=el.value); bsave(s); paintBoard();};
  $("#ws").addEventListener("input",saveWs); $("#ws").addEventListener("change",saveWs);
  $("#wsCopy").onclick=e=>{
    const s=bstate(), w=s.ws||{}, a=BOARD.acts.find(x=>x.code===w.act), byId=Object.fromEntries(BOARD.tools.map(t=>[t.id,t.name]));
    const text=["Activity: "+(a?a.code+" · "+a.name:""),"Link/tool: "+(a?(s.map[a.code]||[]).filter(id=>byId[id]).map(id=>byId[id]).join(" + "):""),"Why this bin: "+(w.why||""),"Theory tags: "+(w.tags||[]).join(", "),"How we'd use it: "+(w.how||"")].join("\n");
    copy(text,e.target.nextElementSibling);
  };
  paintBoard();
}

applyTheme(store.get("course-theme","light"));

function go(k,scroll){
  $$(".phase").forEach(p=>p.classList.toggle("on",p.id==="p-"+k));
  $$(".ph").forEach(b=>b.setAttribute("aria-current",String(b.dataset.go===String(k))));
  if(scroll!==false){ window.scrollTo({top:0,behavior:"instant"}); requestAnimationFrame(()=>window.scrollTo({top:0,behavior:"instant"})); }
}
function fromHash(){const m=location.hash.match(/^#p-([0-9r]+)$/);return m&&CONFIG.pages.some(p=>p[0]===m[1])?m[1]:CONFIG.pages[0][0]}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");
  if(b){const k=b.dataset.go; if(location.hash==="#p-"+k) go(k); else location.hash="p-"+k; return;}
  const cp=e.target.closest("[data-copypre],[data-copyq]");
  if(cp){
    const text=cp.hasAttribute("data-copypre")?cp.closest(".copyrow").previousElementSibling.textContent
      :[...cp.closest(".card").querySelectorAll(".qlist li")].map((li,i)=>(i+1)+". "+li.textContent).join("\n");
    const st=cp.nextElementSibling;
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>st.textContent="Copied.")
      .catch(()=>{st.textContent="Select the text and copy it manually."});
  }
});
window.addEventListener("hashchange",()=>go(fromHash()));
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-chk]"); if(!c) return;
  const st=store.get(CONFIG.storeKey+"-chk",{}); st[c.dataset.chk]=c.checked; store.set(CONFIG.storeKey+"-chk",st);
});

async function load(){
  const texts={};
  await Promise.all(CONFIG.pages.map(async([k])=>{
    const emb=document.getElementById("md"+k); if(emb){texts[k]=emb.textContent;return}
    try{
      const path=k==="r"?"content/refs.md":window.CONTENT_FILES[k];
      const r=await fetch(path,{cache:"no-store"}); if(!r.ok) throw 0; texts[k]=await r.text();
    }catch(e){texts[k]=null}
  }));
  if(Object.values(texts).every(t=>t==null)){
    $("#loadWarn").innerHTML='<div class="banner"><strong>The content did not load.</strong> Browsers block <code>content/*.md</code> when this file is opened from disk. Use the web address, the standalone file, or run <code>python3 -m http.server</code> in this folder.</div>';
    return;
  }
  try{ const emb=document.getElementById("mdp"); const pt=emb?emb.textContent:await (await fetch(window.CONTENT_FILES.p,{cache:"no-store"})).text();
    parseDoc(pt).items.forEach(it=>{PAPERS[it.title]={title:it.title,f:it.f}}); }catch(e){}
  const refsDoc=parseDoc(texts.r||"");
  refsDoc.items.forEach(it=>{ if(it.f.apa) REFS[it.title]={apa:it.f.apa,doi:it.f.doi||"",url:it.f.url||"",short:shortCite(it.f.apa)}; });
  $("#phases").innerHTML=CONFIG.pages.map(([k,label],i)=>{
    const d=parseDoc(texts[k]||""); CUR_PAGE=k;
    let body;
    if(k==="r"){
      const refs=d.items.filter(x=>x.f.apa).sort((a,b)=>a.f.apa.localeCompare(b.f.apa));
      body=md(d.intro)+renderItems(d.items.filter(x=>!x.f.apa))+(refs.length?'<h3 class="sec">References</h3>'+refs.map(x=>
        '<div class="refitem" id="ref-'+esc(x.title)+'">'+inline(x.f.apa)+'<div class="links">'+
        (x.f.doi?'<a href="https://doi.org/'+esc(x.f.doi)+'" target="_blank" rel="noopener">DOI ↗</a>':"")+
        (x.f.url?'<a href="'+esc(x.f.url)+'" target="_blank" rel="noopener">Open ↗</a>':"")+
        '<a href="https://scholar.google.com/scholar?q='+encodeURIComponent(x.f.apa.replace(/\*/g,"").slice(0,150))+'" target="_blank" rel="noopener">Scholar ↗</a></div></div>').join(""):"");
    }else if(d.items.some(x=>x.f.kind==="act")) body='<div class="intro">'+md(d.intro)+"</div>"+boardHtml(d);
    else body='<div class="intro">'+md(d.intro)+"</div>"+renderItems(d.items);
    const prev=CONFIG.pages[i-1], next=CONFIG.pages[i+1];
    return '<section class="phase" id="p-'+k+'"><div class="kicker">'+esc(CONFIG.kicker)+" · "+esc(label)+"</div><h2>"+esc(d.title||label)+"</h2>"+body+
      '<div class="pager">'+(prev?'<button class="pill" data-go="'+prev[0]+'">← '+esc(prev[1])+"</button>":"<span></span>")+
      (next?'<button class="pill" data-go="'+next[0]+'">'+esc(next[1])+" →</button>":"<span></span>")+"</div></section>";
  }).join("");
  initBoard();
  go(fromHash(), !!location.hash);
}
